<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Cinema Tracker</title>
<style>
  :root {
    --bg: #F8FAFC;
    --surface: #FFFFFF;
    --surface-2: #F1F5F9;
    --border: #E2E8F0;
    --text: #0F172A;
    --muted: #64748B;
    --primary: #0F172A;
    --blue: #2563EB;
    --blue-soft: #EFF6FF;
    --red: #E11D48;
    --red-soft: #FFE4E6;
  }

  body.theme-dark {
    --bg: #0A0D12;
    --surface: #12161F;
    --surface-2: #1A202C;
    --border: #262F40;
    --text: #F8FAFC;
    --muted: #94A3B8;
    --primary: #F8FAFC;
    --blue: #3B82F6;
    --blue-soft: rgba(59,130,246,0.16);
    --red: #FB7185;
    --red-soft: rgba(251,113,133,0.16);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding-bottom: 82px;
  }

  header {
    position: sticky; top: 0; z-index: 30;
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 11px 16px; display: flex; align-items: center; justify-content: space-between;
  }
  .hdr-left { display: flex; align-items: center; gap: 10px; }
  .hdr-logo {
    width: 36px; height: 36px; border-radius: 10px; background: #111827;
    display: flex; align-items: center; justify-content: center; gap: 3px;
  }
  .hdr-logo span { width: 6px; height: 6px; border-radius: 999px; }
  .hdr-title h1 { font-size: 15px; font-weight: 800; line-height: 1.2; }
  .hdr-title p { font-size: 10.5px; color: var(--muted); }

  .hdr-btns { display: flex; gap: 8px; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative;
  }
  .badge-dot {
    position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px;
    border-radius: 999px; background: var(--blue); color: #FFF; font-size: 10px;
    font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 4px;
  }

  .main-tabs {
    display: grid; grid-template-columns: 1fr 1fr;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .m-tab {
    padding: 12px 8px; border: none; background: transparent;
    color: var(--muted); font-size: 12px; font-weight: 700;
    border-bottom: 2.5px solid transparent; cursor: pointer;
  }
  .m-tab.active { color: var(--text); border-bottom-color: var(--primary); }

  .toolbar { padding: 12px 16px 6px; }
  .filter-box {
    width: 100%; height: 38px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); padding: 0 12px; font-size: 12.5px; margin-bottom: 9px; outline: none;
  }

  .pills { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
  .pills::-webkit-scrollbar { display: none; }
  .pill {
    padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 11.5px; font-weight: 600;
    white-space: nowrap; cursor: pointer;
  }
  .pill.active { background: var(--primary); border-color: var(--primary); color: var(--surface); }

  .sub-controls {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-top: 4px; font-size: 11.5px; color: var(--muted);
  }
  .chk-wrap { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text); font-size: 11.5px; }
  .sort-sel {
    height: 30px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); padding: 0 8px; font-size: 11.5px;
  }

  .count-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 16px 8px; font-size: 11.5px; color: var(--muted);
  }

  .grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 12px; padding: 0 16px 16px;
  }
  .m-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; display: flex; flex-direction: column; cursor: pointer;
  }
  .poster-box { position: relative; aspect-ratio: 2 / 3; background: var(--surface-2); overflow: hidden; }
  .poster-box img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .tag-top-left {
    position: absolute; top: 8px; left: 8px;
    padding: 3px 7px; border-radius: 6px; font-size: 10px; font-weight: 800;
    background: rgba(15,23,42,0.82); color: #FFF;
  }
  .tag-top-left.presale { background: #F59E0B; color: #111827; }
  .tag-top-left.rerelease { background: #4F46E5; color: #FFF; }
  .tag-top-left.lokal { background: #059669; color: #FFF; }

  /* Immediate visual state for bookmark button on card */
  .bm-btn {
    position: absolute; top: 8px; right: 8px;
    width: 32px; height: 32px; border-radius: 999px; border: none;
    background: rgba(15,23,42,0.62); color: #FFF;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: transform 0.12s ease, background 0.15s ease;
  }
  .bm-btn:active { transform: scale(0.9); }
  .bm-btn.saved {
    background: #E11D48 !important;
    color: #FFFFFF !important;
    box-shadow: 0 2px 8px rgba(225,29,72,0.45);
  }

  .m-body { padding: 9px 10px 10px; display: flex; flex-direction: column; gap: 3px; }
  .m-genre { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-title { font-size: 12.5px; font-weight: 800; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .m-chain { font-size: 10.5px; color: var(--muted); }
  .m-meta { margin-top: 4px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 700; }
  .m-hype { color: var(--blue); }
  .m-date { color: var(--muted); font-weight: 600; }
  .m-countdown { color: var(--blue); font-weight: 800; }

  /* Clean Watchlist focused strictly on Release Date + Countdown */
  .wl-wrap { padding: 12px 16px; }
  .wl-seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .wl-sbtn {
    height: 36px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .wl-sbtn.active { background: var(--primary); border-color: var(--primary); color: var(--surface); }

  .nearest-bar {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 12px; margin-bottom: 10px; display: flex; justify-content: space-between;
    align-items: center; font-size: 12px;
  }

  .wl-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 12px; display: flex; gap: 12px; align-items: center; margin-bottom: 9px; cursor: pointer;
  }
  .wl-img { width: 48px; aspect-ratio: 2 / 3; border-radius: 7px; object-fit: cover; background: var(--surface-2); flex-shrink: 0; }
  .wl-info { flex: 1; min-width: 0; }
  .wl-title { font-size: 13.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wl-release-row { display: flex; align-items: center; gap: 7px; margin-top: 5px; }
  .wl-pill-cd {
    padding: 2px 8px; border-radius: 6px; background: var(--blue-soft); color: var(--blue);
    font-size: 11.5px; font-weight: 800;
  }
  .wl-pill-date { font-size: 12px; font-weight: 700; color: var(--text); }
  .wl-rm {
    width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--muted); font-size: 12px; cursor: pointer; flex-shrink: 0;
  }

  /* Search button immediate state */
  .sr-save-btn {
    margin-top: 6px; height: 30px; padding: 0 11px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font-size: 11.5px; font-weight: 700; cursor: pointer;
  }
  .sr-save-btn.saved {
    background: #E11D48 !important;
    border-color: #E11D48 !important;
    color: #FFFFFF !important;
  }

  /* Cleaner, Sharper Movie Detail Sheet */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(15,23,42,0.58);
    backdrop-filter: blur(3px); z-index: 60; display: none;
    align-items: flex-end; justify-content: center;
  }
  .modal-bg.open { display: flex; }
  .modal-sheet {
    width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
    background: var(--surface); border-top-left-radius: 22px; border-top-right-radius: 22px;
    padding: 16px 16px 28px;
  }
  .sheet-grip {
    width: 36px; height: 4px; border-radius: 999px; background: var(--border);
    margin: 0 auto 14px;
  }
  .d-hero { display: flex; gap: 14px; margin-bottom: 14px; }
  .d-poster { width: 100px; aspect-ratio: 2 / 3; border-radius: 12px; object-fit: cover; background: var(--surface-2); flex-shrink: 0; cursor: pointer; }

  .release-card {
    background: var(--blue-soft); border: 1px solid rgba(37,99,235,0.22);
    border-radius: 12px; padding: 11px 13px; margin-bottom: 12px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .release-card .rc-main { font-size: 13.5px; font-weight: 800; color: var(--text); }
  .release-card .rc-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .release-card .rc-cd {
    padding: 4px 10px; border-radius: 8px; background: var(--blue); color: #FFF;
    font-size: 12px; font-weight: 800;
  }

  .primary-action {
    width: 100%; height: 42px; border-radius: 11px; border: none;
    background: var(--primary); color: var(--surface);
    font-size: 13px; font-weight: 800; cursor: pointer; margin-bottom: 10px;
  }
  .primary-action.saved {
    background: var(--red-soft); color: #BE123C; border: 1px solid rgba(225,29,72,0.25);
  }

  .quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .q-btn {
    border: 1px solid var(--border); background: var(--surface-2); border-radius: 11px;
    padding: 10px 6px; text-align: center; cursor: pointer; color: var(--text);
  }
  .q-btn strong { display: block; font-size: 12px; }
  .q-btn span { display: block; font-size: 10px; color: var(--muted); margin-top: 1px; }

  .rem-box { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; }
  .rem-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12.5px;
  }
  .rem-row:last-child { border-bottom: none; }
  .rem-row input { width: 18px; height: 18px; accent-color: var(--blue); }

  .ticket-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
  .t-btn {
    height: 34px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 11.5px; font-weight: 700; cursor: pointer;
  }

  .poster-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .p-tile { aspect-ratio: 2 / 3; border-radius: 9px; overflow: hidden; border: 2.5px solid transparent; cursor: pointer; background: var(--surface-2); }
  .p-tile.active { border-color: var(--blue); }
  .p-tile img { width: 100%; height: 100%; object-fit: cover; }

  /* Settings */
  .set-wrap { padding: 12px 16px 24px; }
  .set-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .set-card h3 { font-size: 13px; font-weight: 800; margin-bottom: 10px; }
  .theme-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .t-opt { height: 36px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 12px; font-weight: 700; cursor: pointer; }
  .t-opt.active { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); }
  .icon-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ic-card { border: 1px solid var(--border); background: var(--surface); border-radius: 11px; padding: 9px 10px; display: flex; align-items: center; gap: 9px; text-align: left; cursor: pointer; color: var(--text); }
  .ic-card.active { border-color: var(--blue); background: var(--blue-soft); }
  .ic-sq { width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0; }
  .ic-card strong { display: block; font-size: 11.5px; }
  .ic-card span { display: block; font-size: 10px; color: var(--muted); }

  nav.bnav {
    position: fixed; bottom: 0; left: 0; right: 0; height: 64px;
    background: var(--surface); border-top: 1px solid var(--border);
    display: grid; grid-template-columns: repeat(4, 1fr); z-index: 40;
  }
  .nbtn {
    border: none; background: transparent; color: var(--muted); font-size: 10.5px; font-weight: 700;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    cursor: pointer; position: relative;
  }
  .nbtn.active { color: var(--text); }
  .n-badge {
    position: absolute; top: 5px; right: 24%; min-width: 16px; height: 16px;
    border-radius: 999px; background: var(--blue); color: #FFF; font-size: 10px;
    display: flex; align-items: center; justify-content: center; padding: 0 4px;
  }

  .snack {
    position: fixed; bottom: 76px; left: 16px; right: 16px;
    background: #0F172A; color: #FFF; border-radius: 11px;
    padding: 10px 14px; font-size: 12px; font-weight: 600;
    display: none; align-items: center; justify-content: space-between; z-index: 90;
  }
  .snack button { background: transparent; border: none; color: #60A5FA; font-weight: 800; font-size: 12px; cursor: pointer; }
</style>
</head>

<div id="viewRoot"></div>

<nav class="bnav">

  <button class="nbtn" data-tab="watchlist"><span id="wlNavBadge" class="n-badge" style="display:none;">0</span><span>Watchlist</span></button>

<div id="detailSheetBg" class="modal-bg" onclick="closeDetail()">

  </div>
</div>

<div id="posterSheetBg" class="modal-bg" onclick="closePosterPicker()">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="sheet-grip"></div>
    <div id="posterPickerBody"></div>
  </div>
</div>

<div id="alertsSheetBg" class="modal-bg" onclick="closeAlertsSheet()">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="sheet-grip"></div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <h3 style="font-size:15px;">Radar Presale, Jadwal Indo & TBA</h3>
      <button class="t-btn" style="width:auto; padding:0 10px;" onclick="runRadarCheckNow()">Cek Sekarang</button>
    </div>
    <div id="alertsBody" style="font-size:12px; color:var(--muted);"></div>
  </div>
</div>

<div id="snack" class="snack">
  <span id="snackText"></span>
  <button id="snackUndo" style="display:none;" onclick="undoLastRemove()">Urungkan</button>
</div>

  function isSaved(id) {
    return state.watchlist.includes(Number(id));
  }

  function applyVisuals() {
    document.body.classList.toggle("theme-dark", state.theme === "dark");
    const ic = ICONS.find(x => x.key === state.icon) || ICONS[0];
    document.getElementById("topMark").style.background = ic.grad;

    const wlBadge = document.getElementById("wlNavBadge");
    if (state.watchlist.length > 0) {
      wlBadge.style.display = "flex";
      wlBadge.textContent = state.watchlist.length;
    } else {
      wlBadge.style.display = "none";
    }
    document.getElementById("topAlertBadge").textContent = Math.max(1, state.alerts.length);
  }

  function saveState() {
    localStorage.setItem("ct50_theme", state.theme);
    localStorage.setItem("ct50_icon", state.icon);
    localStorage.setItem("ct50_apikey", state.apiKey);
    localStorage.setItem("ct50_movies", JSON.stringify(state.movies));
    localStorage.setItem("ct50_wl", JSON.stringify(state.watchlist));
    localStorage.setItem("ct50_posters", JSON.stringify(state.customPosters));
    localStorage.setItem("ct50_rem", JSON.stringify(state.remPrefs));
    localStorage.setItem("ct50_alerts", JSON.stringify(state.alerts));

    const tracked = state.movies.filter(m => isSaved(m.id));
    const wlObjs = tracked.filter(m => m.date).map(m => {
      const r = state.remPrefs[m.id] || { presale: true, h1: true, h0: true };
      return { id: m.id, title: m.title, release_date: m.date, notify_presale: r.presale, notify_h1: r.h1, notify_h0: r.h0 };
    });
    const tbaObjs = tracked.filter(m => !m.date).map(m => ({ id: m.id, title: m.title }));

    if (window.AndroidBridge && window.AndroidBridge.syncRadarState) {
      window.AndroidBridge.syncRadarState(JSON.stringify(wlObjs), JSON.stringify(tbaObjs), state.apiKey);
    }
    applyVisuals();
  }

  function posterOf(m) {
    return state.customPosters[m.id] || (m.posters && m.posters[0]) || "";
  }

  function fmtDateShort(dStr) {
    if (!dStr) return "TBA";
    const months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
    const d = new Date(dStr + "T00:00:00");
    if (isNaN(d.getTime())) return dStr;
    return `${d.getDate()} ${months[d.getMonth()]}`;
  }

  function countdownText(dStr, slot) {
    if (!dStr) return "TBA";
    if (slot === "now") return "Sedang Tayang";
    const now = new Date(); now.setHours(0, 0, 0, 0);
    const target = new Date(dStr + "T00:00:00");
    if (isNaN(target.getTime())) return dStr;
    const diff = Math.round((target - now) / 86400000);
    if (diff < 0) return "Tayang";
    if (diff === 0) return "Hari Ini";
    return `H-${diff}`;
  }

  function showSnack(msg, allowUndo = false) {
    const el = document.getElementById("snack");
    document.getElementById("snackText").textContent = msg;
    document.getElementById("snackUndo").style.display = allowUndo ? "inline" : "none";
    el.style.display = "flex";
    clearTimeout(window._snackT);
    window._snackT = setTimeout(() => { el.style.display = "none"; }, 2600);
  }

  function toggleWatchlist(rawId, e, externalMovieObj = null) {
    if (e) {
      e.preventDefault();
      e.stopPropagation();
    }
    const id = Number(rawId);

    // Ensure movie exists in master state.movies so Search items appear immediately in Watchlist
    if (externalMovieObj && !state.movies.some(x => Number(x.id) === id)) {
      state.movies.push(externalMovieObj);
    }

    const idx = state.watchlist.indexOf(id);
    const m = state.movies.find(x => Number(x.id) === id);
    if (idx >= 0) {
      state.watchlist.splice(idx, 1);
      state.lastRemoved = id;
      saveState();
      render();
      showSnack("Dihapus dari Watchlist", true);
    } else {
      state.watchlist.push(id);
      if (!state.remPrefs[id]) state.remPrefs[id] = { presale: true, h1: true, h0: true };
      if (m) {
        state.alerts.unshift({
          title: `Radar Aktif: ${m.title}`,
          msg: m.date ? `Dipantau untuk rilis ${m.date} (${countdownText(m.date, m.slot)}).` : `Dipantau jika jadwal bioskop ID diumumkan.`
        });
        state.alerts = state.alerts.slice(0, 30);
      }
      saveState();
      render();
      showSnack("Disimpan ke Watchlist");
    }
  }

  function undoLastRemove() {
    if (state.lastRemoved && !isSaved(state.lastRemoved)) {
      state.watchlist.push(state.lastRemoved);
      state.lastRemoved = null;
      saveState();
      render();
      document.getElementById("snack").style.display = "none";
    }
  }

  function renderBioskop() {
    const nowCount = state.movies.filter(m => m.slot === "now").length;
    const upCount = state.movies.filter(m => m.slot === "upcoming").length;

    let list = state.movies.filter(m => m.slot === state.slot);
    if (state.hideTba) list = list.filter(m => Boolean(m.date));
    if (state.pill === "Lokal ID") list = list.filter(m => m.badge === "LOKAL");
    if (state.pill === "Pre-Sale") list = list.filter(m => m.badge === "PRESALE");
    if (state.pill === "Re-Release") list = list.filter(m => m.badge === "RE-RELEASE");
    if (state.pill === "High Hype") list = list.filter(m => m.hype >= 88);

    if (state.filterText.trim()) {
      const q = state.filterText.trim().toLowerCase();
      list = list.filter(m =>
        m.title.toLowerCase().includes(q) ||
        m.genre.toLowerCase().includes(q) ||
        m.chains.toLowerCase().includes(q)
      );
    }

    if (state.sortBy === "hype") list.sort((a, b) => b.hype - a.hype);
    else if (state.sortBy === "title") list.sort((a, b) => a.title.localeCompare(b.title));
    else list.sort((a, b) => (a.date || "9999-12-31").localeCompare(b.date || "9999-12-31"));

    const pills = ["Semua", "Lokal ID", "Pre-Sale", "Re-Release", "High Hype"];
    const slotLabel = state.slot === "now" ? "Sedang Tayang" : "Akan Datang";

    document.getElementById("viewRoot").innerHTML = `
      <div class="main-tabs">
        <button class="m-tab ${state.slot === 'now' ? 'active' : ''}" onclick="setSlot('now')">SEDANG TAYANG (${nowCount})</button>
        <button class="m-tab ${state.slot === 'upcoming' ? 'active' : ''}" onclick="setSlot('upcoming')">AKAN DATANG (${upCount})</button>
      </div>

      <div class="toolbar">
        <input class="filter-box" type="search" value="${esc(state.filterText)}" placeholder="Filter judul, genre, atau jaringan..." oninput="state.filterText=this.value; renderBioskop();" />
        <div class="pills">
          ${pills.map(p => `<button class="pill ${state.pill === p ? 'active' : ''}" onclick="state.pill='${p}'; renderBioskop();">${p}</button>`).join("")}
        </div>
        <div class="sub-controls">
          <label class="chk-wrap">
            <input type="checkbox" ${state.hideTba ? 'checked' : ''} onchange="state.hideTba=this.checked; renderBioskop();" />
            <span>Sembunyikan TBA</span>
          </label>
          <select class="sort-sel" onchange="state.sortBy=this.value; renderBioskop();">
            <option value="date" ${state.sortBy === 'date' ? 'selected' : ''}>Urut: Tanggal Rilis</option>
            <option value="hype" ${state.sortBy === 'hype' ? 'selected' : ''}>Urut: Hype Tertinggi</option>
            <option value="title" ${state.sortBy === 'title' ? 'selected' : ''}>Urut: Judul A-Z</option>
          </select>
        </div>
      </div>

      <div class="count-row">
        <span>${slotLabel} · ${list.length} film</span>
        <span>Update ${state.lastUpdated}</span>
      </div>

      <div class="grid">
        ${list.map(m => {
          const saved = isSaved(m.id);
          const topBadge = m.badge || m.rating;
          const badgeCls = m.badge === "PRESALE" ? "presale" : (m.badge === "RE-RELEASE" ? "rerelease" : (m.badge === "LOKAL" ? "lokal" : ""));
          return `
            <div class="m-card" onclick="openDetail(${m.id})">
              <div class="poster-box">
                ${posterOf(m) ? `<img src="${posterOf(m)}" loading="lazy" alt="${esc(m.title)}" />` : ""}
                <span class="tag-top-left ${badgeCls}">${topBadge}</span>
                <button class="bm-btn ${saved ? 'saved' : ''}" onclick="toggleWatchlist(${m.id}, event)">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="${saved ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2.2">
                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                  </svg>
                </button>
              </div>
              <div class="m-body">
                <div class="m-genre">${esc(m.genre)}</div>
                <div class="m-title">${esc(m.title)}</div>
                <div class="m-chain">${esc(m.chains)}</div>
                <div class="m-meta">
                  <span class="m-hype">Hype ${m.hype}%</span>
                  <span>
                    <span class="m-date">${fmtDateShort(m.date)}</span>
                    ${m.date && m.slot !== 'now' ? ` · <span class="m-countdown">${countdownText(m.date, m.slot)}</span>` : ""}
                  </span>
                </div>
              </div>
            </div>
          `;
        }).join("")}
      </div>
    `;
  }

  let searchDebounce = null;
  function onSearchTyped(val) {
    state.searchQuery = val;
    clearTimeout(searchDebounce);
    renderCari();
    if (state.apiKey && val.trim().length >= 2) {
      searchDebounce = setTimeout(() => searchTmdbLive(val.trim()), 350);
    }
  }

  async function searchTmdbLive(q) {
    try {
      const resp = await fetch(`https://api.themoviedb.org/3/search/movie?query=${encodeURIComponent(q)}&page=1&api_key=${encodeURIComponent(state.apiKey)}`);
      const json = await resp.json();
      state.searchResults = (json.results || []).slice(0, 14).map(it => {
        const existing = state.movies.find(x => Number(x.id) === Number(it.id));
        if (existing) return existing;
        return {
          id: Number(it.id),
          slot: "upcoming",
          rating: "R13+",
          badge: "",
          genre: "TMDB",
          title: (it.title || "").toUpperCase(),
          chains: "XXI · CGV · Cinépolis",
          date: "",
          global_date: it.release_date || "",
          hype: Math.min(96, Math.round((it.popularity || 40) / 2 + 55)),
          score: it.vote_average ? it.vote_average.toFixed(1) : "8.0",
          runtime: "115m",
          ytKey: "",
          posters: it.poster_path ? [`${IMG}${it.poster_path}`] : [],
          director: "",
          cast: "",
          overview: it.overview || ""
        };
      });
      if (state.tab === "cari") renderCari();
    } catch (_) {}
  }

  function renderCari() {
    const q = state.searchQuery.trim().toLowerCase();
    const localMatches = q
      ? state.movies.filter(m =>
          m.title.toLowerCase().includes(q) ||
          (m.director || "").toLowerCase().includes(q) ||
          (m.cast || "").toLowerCase().includes(q)
        )
      : [];

    const mergedMap = new Map();
    localMatches.forEach(m => mergedMap.set(Number(m.id), m));
    if (q) {
      state.searchResults.forEach(m => {
        if (!mergedMap.has(Number(m.id))) mergedMap.set(Number(m.id), m);
      });
    }
    const items = Array.from(mergedMap.values());

    document.getElementById("viewRoot").innerHTML = `
      <div class="wl-wrap">
        <input class="filter-box" type="search" value="${esc(state.searchQuery)}" placeholder="Judul, sutradara, atau pemeran..." oninput="onSearchTyped(this.value)" />
        ${!q ? '<p style="font-size:12px; color:var(--muted);">Cari jadwal tayang ID dari katalog lokal maupun database TMDB.</p>' : ''}
        ${items.map(m => {
          const saved = isSaved(m.id);
          const encodedObj = escAttr(JSON.stringify(m));
          return `
            <div class="wl-item" onclick="openDetailByObj(${m.id}, '${encodedObj}')">
              <img class="wl-img" src="${posterOf(m)}" alt="" />
              <div class="wl-info">
                <div class="wl-title">${esc(m.title)}</div>
                <div style="font-size:11px; color:var(--muted); margin-top:2px;">
                  ${m.date ? 'Jadwal ID: ' + m.date : (m.global_date ? 'Rilis Global: ' + m.global_date + ' · Menunggu jadwal ID (TBA)' : 'Menunggu jadwal ID (TBA)')}
                </div>
                <button class="sr-save-btn ${saved ? 'saved' : ''}" onclick="toggleWatchlist(${m.id}, event, JSON.parse(decodeURIComponent('${encodeURIComponent(JSON.stringify(m))}')))">
                  ${saved ? '✓ Di Watchlist' : '+ Watchlist'}
                </button>
              </div>
            </div>
          `;
        }).join("")}
      </div>
    `;
  }

  function renderWatchlist() {
    const tracked = state.movies.filter(m => isSaved(m.id));
    const scheduled = tracked
      .filter(m => Boolean(m.date))
      .sort((a, b) => a.date.localeCompare(b.date));
    const waiting = tracked.filter(m => !m.date);
    const list = state.wlSub === "scheduled" ? scheduled : waiting;
    const nearest = scheduled[0];

    document.getElementById("viewRoot").innerHTML = `
      <div class="wl-wrap">
        <div class="wl-seg">
          <button class="wl-sbtn ${state.wlSub === 'scheduled' ? 'active' : ''}" onclick="state.wlSub='scheduled'; renderWatchlist();">Terjadwal (${scheduled.length})</button>
          <button class="wl-sbtn ${state.wlSub === 'tba' ? 'active' : ''}" onclick="state.wlSub='tba'; renderWatchlist();">Menunggu Jadwal (${waiting.length})</button>
        </div>

        ${state.wlSub === "scheduled" && nearest ? `
          <div class="nearest-bar">
            <span>Terdekat: <strong>${esc(nearest.title)}</strong></span>
            <span style="color:var(--blue); font-weight:800;">${countdownText(nearest.date, nearest.slot)} · ${fmtDateShort(nearest.date)}</span>
          </div>
        ` : ""}

        ${list.map(m => `
          <div class="wl-item" onclick="openDetail(${m.id})">
            <img class="wl-img" src="${posterOf(m)}" alt="" />
            <div class="wl-info">
              <div class="wl-title">${esc(m.title)}</div>
              <div class="wl-release-row">
                <span class="wl-pill-cd">${countdownText(m.date, m.slot)}</span>
                <span class="wl-pill-date">${m.date ? fmtDateShort(m.date) + ' ' + m.date.slice(0,4) : 'Menunggu jadwal ID'}</span>
              </div>
            </div>
            <button class="wl-rm" onclick="toggleWatchlist(${m.id}, event)" title="Hapus">✕</button>
          </div>
        `).join("") || '<p style="text-align:center; padding:32px; font-size:12px; color:var(--muted);">Belum ada film di daftar ini.</p>'}
      </div>
    `;
  }

  function renderSettings() {
    document.getElementById("viewRoot").innerHTML = `
      <div class="set-wrap">
        <div class="set-card">
          <h3>Tampilan</h3>
          <div class="theme-3">
            <button class="t-opt ${state.theme === 'light' ? 'active' : ''}" onclick="state.theme='light'; saveState(); renderSettings();">Light Mode</button>
            <button class="t-opt ${state.theme === 'dark' ? 'active' : ''}" onclick="state.theme='dark'; saveState(); renderSettings();">Dark Mode</button>
            <button class="t-opt ${state.theme === 'system' ? 'active' : ''}" onclick="state.theme='system'; saveState(); renderSettings();">System</button>
          </div>
        </div>

        <div class="set-card">
          <h3>API Key TMDB</h3>
          <input class="filter-box" style="margin-bottom:8px;" type="text" value="${esc(state.apiKey)}" placeholder="Masukkan TMDB API Key..." onchange="state.apiKey=this.value.trim(); saveState();" />
          <button class="primary-action" style="margin-bottom:0;" onclick="refreshCatalog()">Simpan & Perbarui Jadwal</button>
        </div>

        <div class="set-card">
          <h3>Pengingat & Latar Belakang</h3>
          <button class="t-btn" style="width:100%; height:38px;" onclick="runRadarCheckNow()">Cek Pengingat Sekarang</button>
        </div>

        <div class="set-card">
          <h3>Ikon Aplikasi</h3>
          <div class="icon-2">
            ${ICONS.map(ic => `
              <button class="ic-card ${state.icon === ic.key ? 'active' : ''}" onclick="selectIcon('${ic.key}')">
                <span class="ic-sq" style="background:${ic.grad}"></span>
                <span>
                  <strong>${ic.name}</strong>
                  <span>${ic.sub}</span>
                </span>
              </button>
            `).join("")}
          </div>
        </div>
      </div>
    `;
  }

  function openDetailByObj(id, encodedJson) {
    const obj = JSON.parse(encodedJson.replace(/&quot;/g, '"'));
    if (!state.movies.some(x => Number(x.id) === Number(id))) {
      state.movies.push(obj);
      saveState();
    }
    openDetail(id);
  }

  function openDetail(rawId) {
    const id = Number(rawId);
    const m = state.movies.find(x => Number(x.id) === id);
    if (!m) return;
    const saved = isSaved(m.id);
    const r = state.remPrefs[m.id] || { presale: true, h1: true, h0: true };

    document.getElementById("detailBody").innerHTML = `
      <div class="d-hero">
        <img class="d-poster" src="${posterOf(m)}" onclick="openPosterPicker(${m.id})" alt="" />
        <div style="flex:1; min-width:0;">
          <div style="font-size:11px; color:var(--muted); margin-bottom:3px;">${m.rating} · ${m.runtime || '120m'} · ★ ${m.score || '8.5'}</div>
          <h2 style="font-size:17px; font-weight:800; line-height:1.25;">${esc(m.title)}</h2>
          <div style="font-size:12px; color:var(--muted); margin-top:4px;">${esc(m.genre)}</div>
          <div style="font-size:11px; color:var(--muted); margin-top:2px;">${esc(m.chains)}</div>
          <button class="t-btn" style="width:auto; padding:0 10px; height:28px; margin-top:8px;" onclick="openPosterPicker(${m.id})">Poster & Download</button>
        </div>
      </div>

      <div class="release-card">
        <div>
          <div class="rc-main">${m.date ? 'Tayang ' + fmtDateShort(m.date) + ' ' + m.date.slice(0,4) : 'Menunggu Jadwal Bioskop ID'}</div>
          <div class="rc-sub">${esc(m.chains)}</div>
        </div>
        <span class="rc-cd">${countdownText(m.date, m.slot)}</span>
      </div>

      <button class="primary-action ${saved ? 'saved' : ''}" onclick="toggleWatchlist(${m.id}); openDetail(${m.id});">
        ${saved ? '✓ Di Watchlist · Ketuk untuk Hapus' : '+ Simpan ke Watchlist'}
      </button>

      <div class="quick-grid">
        <button class="q-btn" onclick="directTrailer(${m.id})">
          <strong>▶ Trailer</strong>
          <span>Putar Langsung</span>
        </button>
        <button class="q-btn" onclick="directLetterboxd(${m.id})">
          <strong>Letterboxd</strong>
          <span>Profil Film</span>
        </button>
        <button class="q-btn" onclick="addCalendarAlert(${m.id})">
          <strong>Kalender</strong>
          <span>Set Pengingat</span>
        </button>
      </div>

      <div class="rem-box">
        <div style="font-size:11px; font-weight:800; color:var(--muted); margin-bottom:4px;">NOTIFIKASI OTOMATIS</div>
        <label class="rem-row">
          <span>Pre-Sale Tiket</span>
          <input type="checkbox" ${r.presale ? 'checked' : ''} onchange="setRem(${m.id},'presale',this.checked)" />
        </label>
        <label class="rem-row">
          <span>H-1 (Besok Tayang)</span>
          <input type="checkbox" ${r.h1 ? 'checked' : ''} onchange="setRem(${m.id},'h1',this.checked)" />
        </label>
        <label class="rem-row">
          <span>Hari-H Rilis</span>
          <input type="checkbox" ${r.h0 ? 'checked' : ''} onchange="setRem(${m.id},'h0',this.checked)" />
        </label>
      </div>

      <div class="ticket-row">
        <button class="t-btn" onclick="openTicketing('${esc(m.title)}','tixid')">TIX ID</button>
        <button class="t-btn" onclick="openTicketing('${esc(m.title)}','xxi')">XXI</button>
        <button class="t-btn" onclick="openTicketing('${esc(m.title)}','cgv')">CGV</button>
        <button class="t-btn" onclick="openTicketing('${esc(m.title)}','cinepolis')">Cinépolis</button>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; font-size:12px; margin-bottom:8px;">
        <div><span style="color:var(--muted); font-size:10.5px;">SUTRADARA</span><br><strong>${esc(m.director || '-')}</strong></div>
        <div><span style="color:var(--muted); font-size:10.5px;">PEMERAN</span><br><strong>${esc(m.cast || '-')}</strong></div>
      </div>
      <p style="font-size:12px; line-height:1.5; color:var(--muted);">${esc(m.overview || '')}</p>
    `;
    document.getElementById("detailSheetBg").classList.add("open");
  }

  function openPosterPicker(id) {
    const m = state.movies.find(x => Number(x.id) === Number(id));
    if (!m) return;
    const pool = Array.from(new Set([...(m.posters || []), ...state.movies.flatMap(x => x.posters || []).slice(0, 6)])).slice(0, 9);

    document.getElementById("posterPickerBody").innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h3 style="font-size:14px; font-weight:800;">${esc(m.title)}</h3>
        <button class="t-btn" style="width:32px; height:32px;" onclick="closePosterPicker()">✕</button>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;">
        <button class="primary-action" style="background:var(--blue); color:#FFF; margin:0;" onclick="downloadPosterHd(${m.id})">Download Poster</button>
        <button class="t-btn" style="height:42px;" onclick="resetDefaultPoster(${m.id})">Reset Default</button>
      </div>
      <div class="poster-grid">
        ${pool.map(url => `
          <div class="p-tile ${posterOf(m) === url ? 'active' : ''}" onclick="applyPosterChoice(${m.id}, '${escJs(url)}')">
            <img src="${url}" loading="lazy" alt="" />
          </div>
        `).join("")}
      </div>
    `;
    document.getElementById("posterSheetBg").classList.add("open");
  }

  function applyPosterChoice(id, url) {
    state.customPosters[id] = url;
    saveState();
    openPosterPicker(id);
    openDetail(id);
    render();
    showSnack("Poster diperbarui");
  }

  function resetDefaultPoster(id) {
    delete state.customPosters[id];
    saveState();
    openPosterPicker(id);
    openDetail(id);
    render();
    showSnack("Poster dikembalikan ke default");
  }

  async function downloadPosterHd(id) {
    const m = state.movies.find(x => Number(x.id) === Number(id));
    const url = m ? posterOf(m).replace("/w500/", "/original/") : "";
    if (!url) return;
    try {
      const resp = await fetch(url);
      const blob = await resp.blob();
      const reader = new FileReader();
      reader.onloadend = () => {
        if (window.AndroidBridge && window.AndroidBridge.savePosterBase64) {
          window.AndroidBridge.savePosterBase64(reader.result, `poster_${id}.jpg`);
        } else {
          const a = document.createElement("a");
          a.href = url; a.download = `poster_${id}.jpg`; a.click();
        }
      };
      reader.readAsDataURL(blob);
    } catch (_) {
      showSnack("Gagal mengunduh poster");
    }
  }

  function directTrailer(id) {
    const m = state.movies.find(x => Number(x.id) === Number(id));
    if (!m) return;
    const year = (m.date || m.global_date || "").slice(0, 4);
    const tmdbId = Number(m.id) < 900000 ? Number(m.id) : 0;
    if (window.AndroidBridge && window.AndroidBridge.openTrailerDirect) {
      window.AndroidBridge.openTrailerDirect(tmdbId, m.ytKey || "", m.title, year, state.apiKey);
    } else if (m.ytKey) {
      window.open(`https://www.youtube.com/watch?v=${m.ytKey}`, "_blank");
    } else {
      window.open(`https://m.youtube.com/results?search_query=${encodeURIComponent(m.title + " " + year + " official trailer")}`, "_blank");
    }
  }

  function directLetterboxd(id) {
    const m = state.movies.find(x => Number(x.id) === Number(id));
    if (!m) return;
    const year = (m.date || m.global_date || "").slice(0, 4);
    const tmdbId = Number(m.id) < 900000 ? Number(m.id) : 0;
    if (window.AndroidBridge && window.AndroidBridge.openLetterboxdDirect) {
      window.AndroidBridge.openLetterboxdDirect(tmdbId, m.title, year);
    } else {
      const slug = m.title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
      window.open(tmdbId > 0 ? `https://letterboxd.com/tmdb/${tmdbId}/` : `https://letterboxd.com/film/${slug}/`, "_blank");
    }
  }

  function addCalendarAlert(id) {
    const m = state.movies.find(x => Number(x.id) === Number(id));
    if (m) showSnack(`Pengingat ${m.title} aktif`);
  }

  function openTicketing(title, chain) {
    window.open(`https://www.google.com/search?q=${encodeURIComponent(title + " " + chain + " jadwal tayang")}`, "_blank");
  }

  function setRem(id, key, val) {
    if (!state.remPrefs[id]) state.remPrefs[id] = { presale: true, h1: true, h0: true };
    state.remPrefs[id][key] = val;
    saveState();
  }

  function selectIcon(key) {
    state.icon = key;
    saveState();
    if (window.AndroidBridge && window.AndroidBridge.switchLauncherIcon) {
      window.AndroidBridge.switchLauncherIcon(key);
    }
    renderSettings();
    showSnack("Ikon aplikasi diperbarui");
  }

  function runRadarCheckNow() {
    const tracked = state.movies.filter(m => isSaved(m.id));
    const sample = tracked[0] || state.movies.find(m => m.id === 1000003);
    const title = `Radar Bioskop: ${sample.title}`;
    const msg = sample.date
      ? `Tayang ${sample.date} (${countdownText(sample.date, sample.slot)}). Pantau Pre-Sale, H-1 & Hari-H.`
      : `Status TBA — Radar memantau pengumuman jadwal rilis bioskop Indonesia.`;
    state.alerts.unshift({ title, msg });
    state.alerts = state.alerts.slice(0, 30);
    saveState();
    if (window.AndroidBridge && window.AndroidBridge.pushInstantAlert) {
      window.AndroidBridge.pushInstantAlert(title, msg);
    }
    openAlertsSheet();
  }

  async function refreshCatalog() {
    const now = new Date();
    state.lastUpdated = `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
    if (!state.apiKey) {
      saveState(); render(); showSnack(`Katalog diperbarui · ${state.lastUpdated}`);
      return;
    }
    try {
      const [up, np] = await Promise.all([
        fetch(`https://api.themoviedb.org/3/movie/upcoming?region=ID&page=1&api_key=${encodeURIComponent(state.apiKey)}`).then(r => r.json()),
        fetch(`https://api.themoviedb.org/3/movie/now_playing?region=ID&page=1&api_key=${encodeURIComponent(state.apiKey)}`).then(r => r.json())
      ]);
      const byId = new Map(state.movies.map(m => [Number(m.id), m]));
      (np.results || []).forEach(it => {
        if (!byId.has(Number(it.id))) {
          byId.set(Number(it.id), {
            id: Number(it.id), slot: "now", rating: "R13+", badge: "", genre: "Cinema",
            title: (it.title || "").toUpperCase(), chains: "XXI · CGV · Cinépolis",
            date: it.release_date || "", hype: Math.min(98, Math.round((it.popularity || 50)/2 + 55)),
            score: it.vote_average ? it.vote_average.toFixed(1) : "8.0", runtime: "115m",
            ytKey: "", posters: it.poster_path ? [`${IMG}${it.poster_path}`] : [],
            director: "", cast: "", overview: it.overview || ""
          });
        }
      });
      (up.results || []).forEach(it => {
        if (!byId.has(Number(it.id))) {
          byId.set(Number(it.id), {
            id: Number(it.id), slot: "upcoming", rating: "R13+", badge: "", genre: "Cinema",
            title: (it.title || "").toUpperCase(), chains: "XXI · CGV · Cinépolis",
            date: it.release_date || "", hype: Math.min(99, Math.round((it.popularity || 50)/2 + 58)),
            score: it.vote_average ? it.vote_average.toFixed(1) : "8.2", runtime: "120m",
            ytKey: "", posters: it.poster_path ? [`${IMG}${it.poster_path}`] : [],
            director: "", cast: "", overview: it.overview || ""
          });
        }
      });
      state.movies = Array.from(byId.values());
      saveState(); render(); showSnack(`Sinkron TMDB selesai · ${state.movies.length} film`);
    } catch (_) {
      saveState(); render(); showSnack("Gagal sinkron TMDB, cek API Key");
    }
  }

  function openAlertsSheet() {
    document.getElementById("alertsBody").innerHTML = state.alerts.map(a => `
      <div style="padding:9px 0; border-bottom:1px solid var(--border);">
        <strong style="color:var(--text); display:block;">${esc(a.title)}</strong>
        <span>${esc(a.msg)}</span>
      </div>
    `).join("");
    document.getElementById("alertsSheetBg").classList.add("open");
  }

  function closeDetail() { document.getElementById("detailSheetBg").classList.remove("open"); }
  function closePosterPicker() { document.getElementById("posterSheetBg").classList.remove("open"); }
  function closeAlertsSheet() { document.getElementById("alertsSheetBg").classList.remove("open"); }
  function setSlot(s) { state.slot = s; state.pill = "Semua"; renderBioskop(); }

  window.handleNativeBack = function() {
    if (document.getElementById("posterSheetBg").classList.contains("open")) { closePosterPicker(); return true; }
    if (document.getElementById("detailSheetBg").classList.contains("open")) { closeDetail(); return true; }
    if (document.getElementById("alertsSheetBg").classList.contains("open")) { closeAlertsSheet(); return true; }
    return false;
  };

  function render() {
    if (state.tab === "bioskop") renderBioskop();
    else if (state.tab === "cari") renderCari();
    else if (state.tab === "watchlist") renderWatchlist();
    else renderSettings();
  }

  function esc(s) { return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function escAttr(s) { return String(s || "").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
  function escJs(s) { return String(s || "").replace(/\/g,"\\").replace(/'/g,"\'"); }

  document.querySelectorAll(".nbtn").forEach(b => {
    b.addEventListener("click", () => {
      document.querySelectorAll(".nbtn").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      state.tab = b.dataset.tab;
      render();
    });
  });

  applyVisuals();
  saveState();
  render();
</script>
</body>
</html>
