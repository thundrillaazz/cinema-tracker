<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cinema Tracker</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --rose: #e11d48;
      --rose-soft: #fff1f2;
      --emerald: #16a34a;
      --emerald-soft: #dcfce7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding-bottom: 72px;
      line-height: 1.45;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 10px;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--text);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-sub {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .icon-btn {
      position: relative;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .icon-btn:active { background: var(--border); }
    .bell-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--blue);
      color: #fff;
      font-size: 9.5px;
      font-weight: 700;
      min-width: 16px;
      height: 16px;
      border-radius: 99px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }

    .search-bar {
      display: none;
      padding: 0 16px 10px;
    }
    .search-bar.open { display: block; }
    .search-input {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      color: var(--text);
      outline: none;
    }
    .search-input:focus { border-color: var(--blue); background: #fff; }

    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-top: 1px solid var(--border);
      background: #fff;
    }
    .mode-tab {
      padding: 10px 8px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
    }
    .mode-tab.active {
      color: var(--text);
      border-bottom-color: var(--text);
    }

    .filter-section {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
    }
    .chips-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 8px;
    }
    .chips-row::-webkit-scrollbar { display: none; }
    .chip {
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--muted);
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active {
      background: var(--text);
      border-color: var(--text);
      color: #fff;
    }
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.5px;
      color: var(--muted);
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
    }
    .sort-select {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text);
      outline: none;
    }

    .status-banner {
      margin: 12px 16px 4px;
      padding: 8px 12px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--muted);
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 10px 16px 20px;
    }
    @media (min-width: 640px) {
      .movie-grid { grid-template-columns: repeat(3, 1fr); }
    }
    .movie-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }
    .movie-card:active { opacity: 0.9; }
    .poster-box {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3;
      background: #0f172a;
      overflow: hidden;
    }
    .poster-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .poster-art {
      width: 100%;
      height: 100%;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #fff;
    }
    .poster-art-title {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.25;
    }
    .poster-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      z-index: 3;
      font-size: 9.5px;
      font-weight: 600;
      padding: 3px 6px;
      border-radius: 4px;
      background: rgba(15, 23, 42, 0.85);
      color: #fff;
    }
    .heart-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      z-index: 4;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      border: none;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .card-info {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      justify-content: space-between;
    }
    .meta-top {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: var(--muted);
    }
    .age-pill {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      font-weight: 600;
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 3px;
    }
    .card-title {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-footer {
      font-size: 11px;
      color: var(--blue);
      font-weight: 500;
      margin-top: 2px;
    }

    .view-container { display: none; padding: 16px; }
    .view-container.active { display: block; }
    
    .watch-item {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
      align-items: center;
    }
    .watch-thumb {
      width: 50px;
      height: 72px;
      border-radius: 6px;
      overflow: hidden;
      flex-shrink: 0;
      background: #0f172a;
      cursor: pointer;
    }
    .watch-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .watch-body { flex: 1; min-width: 0; }
    .watch-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .watch-date { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .watch-toggles { display: flex; gap: 6px; }
    .toggle-pill {
      font-size: 10.5px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--muted);
      cursor: pointer;
    }
    .toggle-pill.active {
      background: var(--blue-soft);
      border-color: #bfdbfe;
      color: var(--blue);
    }

    .info-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .info-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
    .info-card p { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
    .text-input {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12.5px;
      margin-bottom: 8px;
      outline: none;
    }
    .btn-full {
      width: 100%;
      background: var(--text);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 6px;
    }
    .btn-outline {
      width: 100%;
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: #ffffff;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 6px 0 8px;
    }
    .nav-item {
      position: relative;
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 10.5px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
    }
    .nav-item.active { color: var(--text); font-weight: 700; }
    .nav-icon { font-size: 16px; position: relative; }
    .nav-badge {
      position: absolute;
      top: -3px;
      right: -8px;
      background: var(--blue);
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 99px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      z-index: 60;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .detail-sheet {
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      overflow-y: auto;
      background: #ffffff;
      border-radius: 16px 16px 0 0;
      padding: 16px 16px 24px;
      position: relative;
    }
    .close-sheet {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .detail-header {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }
    .detail-poster {
      width: 80px;
      height: 116px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      background: #0f172a;
    }
    .detail-poster img { width: 100%; height: 100%; object-fit: cover; }
    .detail-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .detail-sub { font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }

    .verify-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 11.5px;
    }
    .verify-date { font-weight: 700; color: var(--blue); margin-bottom: 2px; }

    .quick-verify-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .verify-link-btn {
      flex: 1;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      text-align: center;
      cursor: pointer;
    }

    .credits-block { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
    .credits-block p { margin-bottom: 3px; }
    .credits-block strong { color: var(--text); }

    .reminder-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .rem-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 0;
      font-size: 11.5px;
      cursor: pointer;
    }
    .rem-title { font-weight: 600; color: var(--text); }
    .rem-check { width: 16px; height: 16px; accent-color: var(--text); }

    .detail-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn-cal {
      background: var(--text);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-push {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 32px 16px;
      color: var(--muted);
      font-size: 12.5px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="brand">
        <div class="brand-icon">CT</div>
        <div>
          <div class="brand-title">Cinema Tracker</div>
          <div class="brand-sub">ID Theatrical Release</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="toggleSearch()" title="Cari">🔍</button>
        <button class="icon-btn" onclick="switchBottomTab('watchlist')" title="Watchlist">
          🔔
          <span id="headerBellBadge" class="bell-badge" style="display:none;">0</span>
        </button>
        <button class="icon-btn" onclick="forceQuickSync()" title="Refresh">🔄</button>
      </div>
    </div>
    <div id="searchBar" class="search-bar">
      <input id="searchInput" class="search-input" type="text" placeholder="Cari film, sutradara, atau pemeran..." oninput="renderMovies()" />
    </div>
    <div id="modeTabsBar" class="mode-tabs">
      <button id="tabNow" class="mode-tab active" onclick="setMode('now')">SEDANG TAYANG (<span id="countNow">0</span>)</button>
      <button id="tabUpcoming" class="mode-tab" onclick="setMode('upcoming')">AKAN DATANG (<span id="countUpcoming">0</span>)</button>
    </div>
  </header>

  <div id="viewCatalog" class="view-container active" style="padding:0;">
    <div class="filter-section">
      <div class="chips-row">
        <button class="chip active" data-chip="all" onclick="setChip('all', this)">Semua</button>
        <button class="chip" data-chip="id" onclick="setChip('id', this)">Lokal ID</button>
        <button class="chip" data-chip="hype" onclick="setChip('hype', this)">High Hype</button>
        <button class="chip" data-chip="imax" onclick="setChip('imax', this)">IMAX</button>
        <button class="chip" data-chip="XXI" onclick="setChip('XXI', this)">XXI</button>
        <button class="chip" data-chip="CGV" onclick="setChip('CGV', this)">CGV</button>
      </div>
      <div class="controls-row">
        <label class="checkbox-label">
          <input id="hideTbaCheck" type="checkbox" onchange="renderMovies()" />
          Sembunyikan TBA
        </label>
        <select id="sortSelect" class="sort-select" onchange="renderMovies()">
          <option value="date">Urut: Tanggal Rilis</option>
          <option value="hype">Urut: Hype</option>
          <option value="title">Urut: Judul</option>
        </select>
      </div>
    </div>

    <div class="status-banner">
      <span id="bannerLabel">Jadwal Teater Indonesia (November 2026)</span>
      <span id="bannerCount">0 Film</span>
    </div>

    <main id="movieGrid" class="movie-grid"></main>
  </div>

  <div id="viewWatchlist" class="view-container">
    <div class="info-card" style="background:#0f172a; color:#fff; border:none; margin-bottom:12px;">
      <h3 style="color:#fff; margin-bottom:4px;">Watchlist & Radar Presale</h3>
      <p style="color:#cbd5e1; margin-bottom:10px;">Pantau jadwal rilis dan pembukaan presale tiket bioskop Indonesia.</p>
      <button class="btn-outline" style="background:transparent; color:#fff; border-color:#334155;" onclick="sendGlobalTestNotif()">Test Notifikasi HP</button>
    </div>
    <div id="watchlistContainer"></div>
  </div>

  <div id="viewSources" class="view-container">
    <div class="info-card">
      <h3>Pengaturan TMDB API Key</h3>
      <p>Masukkan TMDB API Key v3 untuk sinkronisasi otomatis jadwal bioskop Indonesia.</p>
      <input id="tmdbKeyInput" class="text-input" type="text" placeholder="Tempel API Key di sini..." />
      <button class="btn-full" onclick="syncTmdbLive(true)">Simpan & Sinkronisasi</button>
      <p id="syncFeedback" style="margin-top:6px; font-weight:600; font-size:12px; color:var(--blue);"></p>
    </div>
  </div>

  <nav class="bottom-nav">
    <button id="navCatalog" class="nav-item active" onclick="switchBottomTab('catalog')">
      <span class="nav-icon">🎬</span>
      <span>Bioskop</span>
    </button>
    <button id="navWatchlist" class="nav-item" onclick="switchBottomTab('watchlist')">
      <span class="nav-icon">❤️<span id="navWatchBadge" class="nav-badge" style="display:none;">0</span></span>
      <span>Watchlist</span>
    </button>
    <button id="navSources" class="nav-item" onclick="switchBottomTab('sources')">
      <span class="nav-icon">⚙️</span>
      <span>Pengaturan</span>
    </button>
  </nav>

  <div id="detailOverlay" class="modal-overlay" onclick="closeDetailOnBackdrop(event)">
    <div class="detail-sheet" id="detailContent"></div>
  </div>

  <script>

    let creditsCache = JSON.parse(localStorage.getItem("ct_v32_credits_cache") || "{}");
    let watchlistMap = JSON.parse(localStorage.getItem("ct_v2_watchlist") || "{}");

    function normalizeKey(str) {
      return (str || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function init() {
      if (!localStorage.getItem("ct_v2_initialized")) {
        watchlistMap = {
          "up_1": { presaleAlert: true, dayAlert: false },
          "up_3": { presaleAlert: true, dayAlert: false },
          "up_10": { presaleAlert: true, dayAlert: true },
          "up_11": { presaleAlert: true, dayAlert: true }
        };
        localStorage.setItem("ct_v2_watchlist", JSON.stringify(watchlistMap));
        localStorage.setItem("ct_v2_initialized", "1");
      }

      const liveNow = JSON.parse(localStorage.getItem("ct_v32_live_now") || "[]");
      const liveUpcoming = JSON.parse(localStorage.getItem("ct_v32_live_upcoming") || "[]");
      
      const combinedCurated = [...CURATED_NOW_MOVIES, ...CURATED_UPCOMING_MOVIES];
      const combinedLive = [...liveNow, ...liveUpcoming];

      allMovies = mergeAndFilterMovies(combinedCurated, combinedLive);

      let savedKey = localStorage.getItem("ct_tmdb_key") || "";
      if (!savedKey && window.AndroidBridge && typeof window.AndroidBridge.getTmdbApiKey === "function") {
        savedKey = window.AndroidBridge.getTmdbApiKey() || "";
        if (savedKey) localStorage.setItem("ct_tmdb_key", savedKey);
      }

      if (savedKey) {
        document.getElementById("tmdbKeyInput").value = savedKey;
        setTimeout(() => syncTmdbLive(false), 250);
      }

      updateCounts();
      renderMovies();
      renderWatchlist();
    }

    function mergeAndFilterMovies(curated, live) {
      const map = new Map();
      const seenNormalized = new Map();

      curated.forEach(item => {
        const m = { ...item };
        if (m.status === "now") {
          if (m.releaseDate > TODAY_ISO) m.status = "upcoming";
        }
        if (!m.poster && posterCache[m.id]) {
          m.poster = posterCache[m.id];
        }
        map.set(m.id, m);
        seenNormalized.set(normalizeKey(m.title), m.id);
      });

      live.forEach(item => {
        const m = { ...item };
        if (m.releaseDate < "2026-10-01" || m.releaseDate > "2027-12-31") return;
        if (m.releaseDate <= TODAY_ISO) {
          m.status = "now";
        } else {
          m.status = "upcoming";
        }

        const norm = normalizeKey(m.title);
        if (seenNormalized.has(norm)) {
          const existingId = seenNormalized.get(norm);
          const existing = map.get(existingId);
          if (existing && !existing.poster && m.poster) {
            existing.poster = m.poster;
            posterCache[existingId] = m.poster;
          }
          return;
        }
        if (creditsCache[m.id]) {
          m.director = creditsCache[m.id].director || m.director;
          m.cast = creditsCache[m.id].cast || m.cast;
          m.runtime = creditsCache[m.id].runtime || m.runtime;
        }
        if (!map.has(m.id)) {
          map.set(m.id, m);
          seenNormalized.set(norm, m.id);
        }
      });

      localStorage.setItem("ct_v32_poster_cache", JSON.stringify(posterCache));
      return Array.from(map.values());
    }

    function updateCounts() {
      const nowList = allMovies.filter(m => m.status === "now");
      const upList = allMovies.filter(m => m.status === "upcoming");
      document.getElementById("countNow").textContent = nowList.length;
      document.getElementById("countUpcoming").textContent = upList.length;

      const watchCount = Object.keys(watchlistMap).length;
      const bell = document.getElementById("headerBellBadge");
      const navBadge = document.getElementById("navWatchBadge");
      if (watchCount > 0) {
        bell.style.display = "flex";
        bell.textContent = watchCount;
        navBadge.style.display = "flex";
        navBadge.textContent = watchCount;
      } else {
        bell.style.display = "none";
        navBadge.style.display = "none";
      }
    }

    function toggleSearch() {
      const bar = document.getElementById("searchBar");
      bar.classList.toggle("open");
      if (bar.classList.contains("open")) {
        document.getElementById("searchInput").focus();
      }
    }

    function setMode(mode) {
      activeMode = mode;
      document.getElementById("tabNow").classList.toggle("active", mode === "now");
      document.getElementById("tabUpcoming").classList.toggle("active", mode === "upcoming");
      renderMovies();
    }

    function setChip(chip, el) {
      activeChip = chip;
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      el.classList.add("active");
      renderMovies();
    }

    function switchBottomTab(tab) {
      activeBottomTab = tab;
      document.getElementById("viewCatalog").classList.toggle("active", tab === "catalog");
      document.getElementById("viewWatchlist").classList.toggle("active", tab === "watchlist");
      document.getElementById("viewSources").classList.toggle("active", tab === "sources");
      document.getElementById("modeTabsBar").style.display = tab === "catalog" ? "grid" : "none";

      document.getElementById("navCatalog").classList.toggle("active", tab === "catalog");
      document.getElementById("navWatchlist").classList.toggle("active", tab === "watchlist");
      document.getElementById("navSources").classList.toggle("active", tab === "sources");

      if (tab === "watchlist") renderWatchlist();
    }

    function forceQuickSync() {
      const key = localStorage.getItem("ct_tmdb_key") || document.getElementById("tmdbKeyInput").value.trim();
      if (!key) {
        switchBottomTab("sources");
        return;
      }
      syncTmdbLive(true);
    }

    function renderMovies() {
      const grid = document.getElementById("movieGrid");
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      const hideTba = document.getElementById("hideTbaCheck").checked;
      const sortBy = document.getElementById("sortSelect").value;

      let list = allMovies.filter(m => {
        if (m.status !== activeMode) return false;
        if (hideTba && m.tba) return false;

        if (activeChip === "id" && !m.isIndonesian) return false;
        if (activeChip === "hype" && m.hype < 88) return false;
        if (activeChip === "imax" && !m.imax) return false;
        if (["XXI", "CGV"].includes(activeChip) && !(m.chains || []).includes(activeChip)) return false;

        if (q) {
          const hay = `${m.title} ${m.genre} ${m.director} ${m.cast}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      if (sortBy === "date") {
        list.sort((a, b) => a.releaseDate.localeCompare(b.releaseDate));
      } else if (sortBy === "hype") {
        list.sort((a, b) => (b.hype || 0) - (a.hype || 0));
      } else if (sortBy === "title") {
        list.sort((a, b) => a.title.localeCompare(b.title));
      }

      document.getElementById("bannerLabel").textContent = activeMode === "now"
        ? "Sedang Tayang di Bioskop Indonesia"
        : "Jadwal Rilis Teater";
      document.getElementById("bannerCount").textContent = `${list.length} Film`;

      if (list.length === 0) {
        grid.innerHTML = `<div class="empty-msg">Tidak ada film ditemukan.</div>`;
        return;
      }

      grid.innerHTML = list.map(m => {
        const isWatched = Boolean(watchlistMap[m.id]);
        let badgeText = "";
        if (m.presale) badgeText = "PRESALE";
        else if (m.imax) badgeText = "IMAX";
        else if (m.isIndonesian) badgeText = "LOKAL";

        const posterHtml = m.poster
          ? `<img src="${m.poster}" alt="${m.title}" loading="lazy" />`
          : `<div class="poster-art"><div class="poster-art-title">${m.title}</div></div>`;

        const footerText = activeMode === "upcoming" ? `Rilis: ${m.dateLabel}` : `Rating ${m.rating || '8.8'}`;

        return `
          <article class="movie-card" onclick="openDetail('${m.id}')">
            <div class="poster-box">
              ${badgeText ? `<span class="poster-badge">${badgeText}</span>` : ''}
              <button class="heart-btn" onclick="event.stopPropagation(); toggleWatch('${m.id}')" aria-label="Watchlist">
                ${isWatched ? "❤️" : "🤍"}
              </button>
              ${posterHtml}
            </div>
            <div class="card-info">
              <div>
                <div class="meta-top">
                  <span class="age-pill">${m.age || 'R 13+'}</span>
                  <span>${m.genre}</span>
                </div>
                <div class="card-title">${m.title}</div>
              </div>
              <div class="card-footer">${footerText}</div>
            </div>
          </article>
        `;
      }).join("");
    }

    function toggleWatch(id) {
      if (watchlistMap[id]) {
        delete watchlistMap[id];
      } else {
        watchlistMap[id] = { presaleAlert: true, dayAlert: true };
      }
      localStorage.setItem("ct_v2_watchlist", JSON.stringify(watchlistMap));
      updateCounts();
      renderMovies();
      if (activeBottomTab === "watchlist") renderWatchlist();
    }

    function openTicketSearch(platform, movieTitle) {
      const q = encodeURIComponent(movieTitle);
      let url = `https://www.google.com/search?q=${encodeURIComponent(movieTitle + " bioskop " + platform)}`;
      if (platform === "TIX ID") url = `https://www.tix.id/search?q=${q}`;
      else if (platform === "XXI") url = `https://21cineplex.com/`;
      else if (platform === "CGV") url = `https://www.cgv.id/en/movies/now_playing`;

      if (window.AndroidBridge && typeof window.AndroidBridge.openExternalUrl === "function") {
        window.AndroidBridge.openExternalUrl(url);
      } else {
        window.open(url, "_blank");
      }
    }

              <span class="age-pill">${m.age || 'R 13+'}</span>
              <span class="age-pill">${m.runtime || 'TBA'}</span>
              ${m.imax ? '<span class="age-pill" style="background:#0f172a;color:#fff;">IMAX</span>' : ''}
            </div>
            <div class="detail-title">${m.title}</div>
            <div style="font-size:12px; color:var(--muted); margin-bottom:4px;">Genre: ${m.genre}</div>
            <div style="font-size:12px; font-weight:600; color:var(--text);">Hype Index: ${m.hype}%</div>
          </div>
        </div>

        <div class="verify-box">
          <div class="verify-date">${m.confirmedText || ('Rilis: ' + m.releaseDate)}</div>
          <div style="color:var(--muted);">${m.presaleText || 'Cek presale di platform resmi.'}</div>
        </div>

        <div class="quick-verify-bar">
          <button class="verify-link-btn" onclick="openTicketSearch('TIX ID', '${safeTitle}')">TIX ID</button>
          <button class="verify-link-btn" onclick="openTicketSearch('XXI', '${safeTitle}')">Cinema XXI</button>
          <button class="verify-link-btn" onclick="openTicketSearch('CGV', '${safeTitle}')">CGV ID</button>
        </div>

        <div class="credits-block">
          <p><strong>Sutradara:</strong> ${m.director || 'Memuat...'}</p>
          <p><strong>Pemeran:</strong> ${m.cast || 'Memuat...'}</p>
          <p style="margin-top:6px;"><strong>Sinopsis:</strong><br>${m.synopsis}</p>
        </div>

        <div class="reminder-box">
          <label class="rem-option">
            <span class="rem-title">Notifikasi Presale Tiket</span>
            <input type="checkbox" class="rem-check" ${watchCfg.presaleAlert ? 'checked' : ''} onchange="updateReminder('${m.id}', 'presaleAlert', this.checked)" />
          </label>
          <label class="rem-option">
            <span class="rem-title">Notifikasi Hari-H Rilis</span>
            <input type="checkbox" class="rem-check" ${watchCfg.dayAlert ? 'checked' : ''} onchange="updateReminder('${m.id}', 'dayAlert', this.checked)" />
          </label>
        </div>

        <div class="detail-actions">
          <button class="btn-cal" onclick="saveMovieToCalendar('${m.id}')">Simpan Kalender</button>
          <button class="btn-push" onclick="testMoviePush('${m.id}')">Test Notif</button>
        </div>
      `;
    }

    async function openDetail(id) {
      const m = allMovies.find(item => item.id === id);
      if (!m) return;

      renderDetailHtml(m);
      document.getElementById("detailOverlay").classList.add("open");

      if (m.tmdbId && (!m.director || m.director === "Memuat..." || !m.cast || m.cast === "Memuat...")) {
        const key = localStorage.getItem("ct_tmdb_key") || "";
        if (key) {
          try {
            const res = await fetch(`https://api.themoviedb.org/3/movie/${m.tmdbId}?api_key=${encodeURIComponent(key)}&append_to_response=credits`);
            if (res.ok) {
              const d = await res.json();
              const directors = ((d.credits && d.credits.crew) || []).filter(c => c.job === "Director").map(c => c.name);
              const topCast = ((d.credits && d.credits.cast) || []).slice(0, 4).map(c => c.name);

              m.director = directors.length ? directors.join(", ") : "Tidak tercantum";
              m.cast = topCast.length ? topCast.join(", ") : "Segera diumumkan";
              if (d.runtime && d.runtime > 0) m.runtime = `${d.runtime}m`;

              creditsCache[m.id] = { director: m.director, cast: m.cast, runtime: m.runtime };
              localStorage.setItem("ct_v32_credits_cache", JSON.stringify(creditsCache));
              renderDetailHtml(m);
            }
          } catch (_) {}
        }
      }
    }

    function closeDetail() {
      document.getElementById("detailOverlay").classList.remove("open");
    }

    function closeDetailOnBackdrop(e) {
      if (e.target.id === "detailOverlay") closeDetail();
    }

    window.handleAndroidBack = function() {
      if (document.getElementById("detailOverlay").classList.contains("open")) {
        closeDetail();
        return "true";
      }
      return "false";
    };

    function updateReminder(id, field, enabled) {
      const current = watchlistMap[id] || { presaleAlert: false, dayAlert: false };
      current[field] = enabled;
      if (!current.presaleAlert && !current.dayAlert) {
        delete watchlistMap[id];
      } else {
        watchlistMap[id] = current;
      }
      localStorage.setItem("ct_v2_watchlist", JSON.stringify(watchlistMap));
      updateCounts();
      renderMovies();
      if (activeBottomTab === "watchlist") renderWatchlist();
    }

    function renderWatchlist() {
      const container = document.getElementById("watchlistContainer");
      const ids = Object.keys(watchlistMap);
      if (ids.length === 0) {
        container.innerHTML = `<div class="info-card" style="text-align:center; padding:24px 16px;">
          <p style="margin:0;">Watchlist kosong. Ketuk ikon 🤍 pada poster film untuk memantau rilis.</p>
        </div>`;
        return;
      }

      container.innerHTML = ids.map(id => {
        const m = allMovies.find(item => item.id === id);
        if (!m) return "";
        const cfg = watchlistMap[id];
        const thumb = m.poster
          ? `<img src="${m.poster}" alt="${m.title}" />`
          : `<div style="width:100%;height:100%;background:#0f172a;color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px;">${m.title}</div>`;

        return `
          <div class="watch-item">
            <div class="watch-thumb" onclick="openDetail('${m.id}')">${thumb}</div>
            <div class="watch-body">
              <div class="watch-title" onclick="openDetail('${m.id}')">${m.title}</div>
              <div class="watch-date">Rilis: ${m.dateLabel} (${m.releaseDate})</div>
              <div class="watch-toggles">
                <button class="toggle-pill ${cfg.presaleAlert ? 'active' : ''}" onclick="updateReminder('${m.id}', 'presaleAlert', ${!cfg.presaleAlert})">
                  Presale ${cfg.presaleAlert ? 'ON' : 'OFF'}
                </button>
                <button class="toggle-pill ${cfg.dayAlert ? 'active' : ''}" onclick="updateReminder('${m.id}', 'dayAlert', ${!cfg.dayAlert})">
                  Hari-H ${cfg.dayAlert ? 'ON' : 'OFF'}
                </button>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function saveMovieToCalendar(id) {
      const m = allMovies.find(item => item.id === id);
      if (!m) return;
      const startMillis = new Date(m.releaseDate + "T10:00:00+07:00").getTime();
      const title = `Nonton Bioskop: ${m.title}`;
      const desc = `${m.confirmedText}\n${m.presaleText}`;
      const loc = "Bioskop Indonesia";

      if (window.AndroidBridge && typeof window.AndroidBridge.addCalendarEvent === "function") {
        window.AndroidBridge.addCalendarEvent(title, desc, loc, startMillis);
      } else {
        alert(`Jadwal ${m.title} (${m.releaseDate}) siap disimpan.`);
      }
    }

    function testMoviePush(id) {
      const m = allMovies.find(item => item.id === id);
      if (!m) return;
      const title = `Rilis Bioskop: ${m.title}`;
      const body = `${m.confirmedText} • Cek tiket di TIX ID, M-TIX, atau CGV.`;
      if (window.AndroidBridge && typeof window.AndroidBridge.sendCustomNotification === "function") {
        window.AndroidBridge.sendCustomNotification(title, body);
      } else {
        alert(title + "\n" + body);
      }
    }

    function sendGlobalTestNotif() {
      const title = "Cinema Tracker Aktif";
      const body = "Sistem pemantau jadwal bioskop Indonesia berjalan di latar belakang.";
      if (window.AndroidBridge && typeof window.AndroidBridge.sendCustomNotification === "function") {
        window.AndroidBridge.sendCustomNotification(title, body);
      } else {
        alert(title + "\n" + body);
      }
    }

    async function enrichPosters(apiKey, movieList) {
      const missing = movieList.filter(m => !posterCache[m.id]);
      if (missing.length === 0) return;

      await Promise.all(missing.map(async (m) => {
        try {
          const q = encodeURIComponent(m.searchQuery || m.title);
          const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${encodeURIComponent(apiKey)}&query=${q}&page=1`);
          if (!res.ok) return;
          const data = await res.json();
          const hit = (data.results || []).find(r => r.poster_path);
          if (hit && hit.poster_path) {
            posterCache[m.id] = `https://image.tmdb.org/t/p/w500${hit.poster_path}`;
          }
        } catch (_) {}
      }));

      localStorage.setItem("ct_v32_poster_cache", JSON.stringify(posterCache));
    }

    async function fetchMovieCreditsBatch(apiKey, movieItems) {
      const toFetch = movieItems.filter(m => !creditsCache[m.id] && m.tmdbId);
      if (toFetch.length === 0) return;

      await Promise.all(toFetch.map(async (m) => {
        try {
          const res = await fetch(`https://api.themoviedb.org/3/movie/${m.tmdbId}?api_key=${encodeURIComponent(apiKey)}&append_to_response=credits`);
          if (!res.ok) return;
          const d = await res.json();
          const directors = ((d.credits && d.credits.crew) || []).filter(c => c.job === "Director").map(c => c.name);
          const topCast = ((d.credits && d.credits.cast) || []).slice(0, 4).map(c => c.name);

          creditsCache[m.id] = {
            director: directors.length ? directors.join(", ") : "Tidak tercantum",
            cast: topCast.length ? topCast.join(", ") : "Segera diumumkan",
            runtime: (d.runtime && d.runtime > 0) ? `${d.runtime}m` : "TBA"
          };
        } catch (_) {}
      }));

      localStorage.setItem("ct_v32_credits_cache", JSON.stringify(creditsCache));
    }

    async function syncTmdbLive(showFeedback = true) {
      const key = document.getElementById("tmdbKeyInput").value.trim() || localStorage.getItem("ct_tmdb_key") || "";
      const fb = document.getElementById("syncFeedback");

      if (!key) {
        if (showFeedback) {
          fb.textContent = "Masukkan TMDB API Key terlebih dahulu.";
          fb.style.color = "#e11d48";
        }
        return;
      }

      localStorage.setItem("ct_tmdb_key", key);
      if (window.AndroidBridge && typeof window.AndroidBridge.saveTmdbApiKey === "function") {
        window.AndroidBridge.saveTmdbApiKey(key);
      }

      if (showFeedback) {
        fb.textContent = "Menyinkronkan jadwal...";
        fb.style.color = "#2563eb";
      }

      try {
        await enrichPosters(key, CURATED_NOW_MOVIES);
        await enrichPosters(key, CURATED_UPCOMING_MOVIES);

        const nowUrl = `https://api.themoviedb.org/3/movie/now_playing?api_key=${encodeURIComponent(key)}&region=ID&page=1`;
        const upcomingUrl = `https://api.themoviedb.org/3/discover/movie?api_key=${encodeURIComponent(key)}&region=ID&with_release_type=2|3&with_original_language=en|id|ja|ko&release_date.gte=${TODAY_ISO}&sort_by=popularity.desc&page=1`;

        const [resNow, resUpcoming] = await Promise.all([fetch(nowUrl), fetch(upcomingUrl)]);
        
        const dataNow = resNow.ok ? await resNow.json() : { results: [] };
        const dataUpcoming = resUpcoming.ok ? await resUpcoming.json() : { results: [] };

        const parseItems = (results, statusType) => {
          return (results || [])
            .filter(item => {
              const rDate = item.release_date || "";
              if (!rDate || rDate < "2026-10-01" || rDate > "2027-12-31") return false;
              if (!item.poster_path) return false;
              if (statusType === "now" && rDate > TODAY_ISO) return false;
              if (statusType === "upcoming" && rDate < TODAY_ISO) return false;
              return true;
            })
            .map(item => {
              const dObj = new Date(item.release_date + "T00:00:00");
              const dateLabel = statusType === "now" ? "Sedang Tayang" : dObj.toLocaleDateString("id-ID", {
                day: "numeric", month: "short", year: item.release_date.startsWith("2027") ? "numeric" : undefined
              });
              const hypeScore = Math.min(97, Math.max(76, Math.round(74 + Math.min(23, (item.popularity || 10) / 4))));
              const genresText = (item.genre_ids || []).slice(0, 2).map(gid => GENRE_MAP[gid]).filter(Boolean).join(", ") || "Theatrical";

              const idKey = "tmdb_" + item.id;
              const cachedCred = creditsCache[idKey] || {};

              return {
                id: idKey, tmdbId: item.id, status: statusType, isIndonesian: item.original_language === "id",
                title: (item.title || item.original_title || "").toUpperCase(), releaseDate: item.release_date,
                dateLabel: dateLabel, confirmedText: statusType === "now" ? "Sedang tayang di bioskop Indonesia" : `Rilis: ${item.release_date}`,
                presaleText: "Cek presale di TIX ID, M-TIX, atau CGV.", sourceBadge: "TMDB ID",
                age: item.adult ? "D 17+" : "R 13+", runtime: cachedCred.runtime || "TBA", genre: genresText,
                hype: hypeScore, rating: ((item.vote_average || 8.2)).toFixed(1), presale: false,
                imax: (item.popularity || 0) >= 65, tba: false, chains: ["XXI", "CGV", "Cinépolis"],
                director: cachedCred.director || "Memuat...", cast: cachedCred.cast || "Memuat...",
                synopsis: item.overview || "Jadwal tayang layar lebar Indonesia.",
                poster: `https://image.tmdb.org/t/p/w500${item.poster_path}`
              };
            });
        };

        const liveNow = parseItems(dataNow.results, "now");
        const liveUpcoming = parseItems(dataUpcoming.results, "upcoming");

        localStorage.setItem("ct_v32_live_now", JSON.stringify(liveNow));
        localStorage.setItem("ct_v32_live_upcoming", JSON.stringify(liveUpcoming));

        await fetchMovieCreditsBatch(key, [...liveNow, ...liveUpcoming, ...CURATED_NOW_MOVIES, ...CURATED_UPCOMING_MOVIES]);

        allMovies = mergeAndFilterMovies([...CURATED_NOW_MOVIES, ...CURATED_UPCOMING_MOVIES], [...liveNow, ...liveUpcoming]);
        updateCounts();
        renderMovies();
        if (activeBottomTab === "watchlist") renderWatchlist();

        if (showFeedback) {
          fb.textContent = "Sinkronisasi berhasil.";
          fb.style.color = "#16a34a";
        }
      } catch (e) {
        renderMovies();
        if (showFeedback) {
          fb.textContent = "Gagal sinkronisasi.";
          fb.style.color = "#e11d48";
        }
      }
    }

    init();
  </script>
</body>
</html>
