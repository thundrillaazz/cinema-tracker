name: Build Cinema Tracker Android APK
run-name: ${{ github.event.head_commit.message || 'Cinema Tracker APK Build' }}

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app version
        id: app_ver
        run: |
          VER_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' || echo "4.3")
          VER_CODE=$((100 + GITHUB_RUN_NUMBER))
          echo "name=${VER_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VER_CODE}" >> "$GITHUB_OUTPUT"
          {
            echo "### Cinema Tracker v${VER_NAME} (Build #${GITHUB_RUN_NUMBER}, code ${VER_CODE}) · Stable"
            echo "- Artifact: \`cinema-tracker-v${VER_NAME}-apk\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing keystore (if configured)
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ] && [ -n "$SIGNING_STORE_PASSWORD" ] && [ -n "$SIGNING_KEY_ALIAS" ] && [ -n "$SIGNING_KEY_PASSWORD" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > app/keystore.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        id: build_apk
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          VER_CODE="${{ steps.app_ver.outputs.code }}"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            gradle assembleRelease --no-daemon -PAPP_VERSION_CODE="$VER_CODE"
            APK_SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          else
            gradle assembleDebug --no-daemon -PAPP_VERSION_CODE="$VER_CODE"
            APK_SRC=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          fi
          mkdir -p dist-apk
          cp "$APK_SRC" dist-apk/CinemaTracker-latest.apk
          cat <<EOF > dist-apk/release-meta.json
          {
            "versionCode": ${VER_CODE},
            "versionName": "${{ steps.app_ver.outputs.name }}",
            "buildNumber": ${GITHUB_RUN_NUMBER},
            "signed": ${{ steps.signing.outputs.signed }},
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/latest/CinemaTracker-latest.apk",
            "updatedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Clean temporary keystore
        if: always()
        run: rm -f app/keystore.jks

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinema-tracker-v${{ steps.app_ver.outputs.name }}-apk
          path: dist-apk/CinemaTracker-latest.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER_NAME="${{ steps.app_ver.outputs.name }}"
          VER_CODE="${{ steps.app_ver.outputs.code }}"
          VER_TAG="v${VER_NAME}-b${GITHUB_RUN_NUMBER}"
          VER_APK="dist-apk/CinemaTracker-${VER_TAG}.apk"
          cp dist-apk/CinemaTracker-latest.apk "$VER_APK"
          NOTES="Cinema Tracker v${VER_NAME} (Build #${GITHUB_RUN_NUMBER}, versionCode ${VER_CODE})"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist-apk/CinemaTracker-latest.apk dist-apk/release-meta.json --clobber
            gh release edit latest --title "Cinema Tracker v${VER_NAME} (Build #${GITHUB_RUN_NUMBER})" --notes "$NOTES"
          else
            gh release create latest dist-apk/CinemaTracker-latest.apk dist-apk/release-meta.json --title "Cinema Tracker v${VER_NAME} (Build #${GITHUB_RUN_NUMBER})" --notes "$NOTES"
          fi
          if ! gh release view "$VER_TAG" >/dev/null 2>&1; then
            gh release create "$VER_TAG" "$VER_APK" dist-apk/release-meta.json --title "Cinema Tracker ${VER_TAG}" --notes "$NOTES"
          fi
