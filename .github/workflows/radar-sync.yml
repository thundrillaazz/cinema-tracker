name: Build Cinema Tracker Android APK
run-name: ${{ github.event.head_commit.message || 'Cinema Tracker APK Build' }}

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app version
        id: app_ver
        run: |
          VER_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' || echo "4.2")
          VER_CODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/.*=[[:space:]]*([0-9]+).*/\1/' || echo "42")
          echo "name=${VER_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VER_CODE}" >> "$GITHUB_OUTPUT"
          {
            echo "### Cinema Tracker v${VER_NAME} (Build ${VER_CODE}) · Stable"
            echo "- Artifact: \`cinema-tracker-v${VER_NAME}-debug-apk\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinema-tracker-v${{ steps.app_ver.outputs.name }}-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
