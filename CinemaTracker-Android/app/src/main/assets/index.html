<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f5f6fa"><title>Cinema Tracker</title>
<style>
:root{color-scheme:light;--bg:#f5f6fa;--surface:#fff;--surface2:#edf0f5;--text:#151a27;--muted:#788195;--line:#e5e8ef;--accent:#e33455;--accent-soft:#fff0f3;--nav:#fff;--shadow:0 8px 28px #17213a0b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}body{padding-bottom:86px}body.dark{color-scheme:dark;--bg:#0e1118;--surface:#171c26;--surface2:#222a37;--text:#f2f4f8;--muted:#9aa5b6;--line:#293140;--accent:#ff5574;--accent-soft:#351d27;--nav:#171c26;--shadow:0 8px 28px #0003}button,input,select{font:inherit}button{cursor:pointer;color:inherit;border:0} .top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 15px 10px}.toprow{display:flex;align-items:center;gap:9px}.brand{display:flex;align-items:center;gap:9px;flex:1;font-weight:800;font-size:16px;letter-spacing:-.3px}.brandmark{width:31px;height:31px;border-radius:9px;background:#14264b;color:#fff;display:grid;place-items:center;font-size:16px}.subbrand{font-size:9px;color:var(--muted);font-weight:600;letter-spacing:.4px}.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-size:17px;position:relative}.count{position:absolute;right:-3px;top:-4px;background:var(--accent);color:white;border-radius:20px;min-width:16px;height:16px;font-size:10px;display:grid;place-items:center;padding:0 4px}.tabs{display:flex;gap:20px;overflow:auto;scrollbar-width:none;margin-top:12px}.tabs button{background:none;color:var(--muted);font-size:11px;font-weight:800;white-space:nowrap;padding:6px 1px 8px;border-bottom:2px solid transparent}.tabs button.active{color:var(--text);border-color:var(--accent)}main{padding:15px;max-width:760px;margin:auto}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}.sectionhead h2{font-size:18px;letter-spacing:-.5px;margin:0}.muted{color:var(--muted)}.tiny{font-size:11px}.chips{display:flex;gap:7px;overflow:auto;margin:0 0 14px;scrollbar-width:none}.chip{white-space:nowrap;padding:7px 11px;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-size:11px;color:var(--muted)}.chip.active{background:var(--text);color:var(--surface);border-color:var(--text)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.movie{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:var(--shadow)}.posterwrap{position:relative;aspect-ratio:2/2.85;background:var(--surface2);overflow:hidden}.poster{width:100%;height:100%;object-fit:cover;display:block}.posterplaceholder{height:100%;display:grid;place-items:center;color:var(--muted);font-size:32px}.save{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:11px;background:#101522b8;color:white;backdrop-filter:blur(8px);font-size:17px}.save.saved{background:var(--accent);color:white}.movieinfo{padding:10px}.movietitle{font-size:12px;font-weight:800;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:31px}.meta{font-size:10px;color:var(--muted);margin-top:5px}.rating{color:#d18a21;font-weight:700}.empty{padding:32px 18px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:16px;color:var(--muted)}.empty b{display:block;color:var(--text);margin-bottom:5px}.searchbox{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:0 12px;margin:12px 0}.searchbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);padding:13px 0}.searchresult{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;margin:9px 0}.searchresult img{width:66px;height:96px;object-fit:cover;border-radius:8px;background:var(--surface2)}.searchresult .details{flex:1;min-width:0}.searchresult h3{font-size:13px;margin:2px 0 5px}.primary,.secondary,.danger{padding:9px 12px;border-radius:10px;font-size:11px;font-weight:800}.primary{background:var(--accent);color:#fff}.secondary{background:var(--surface2);color:var(--text)}.danger{background:var(--accent-soft);color:var(--accent)}.releasecard{display:flex;gap:12px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:15px;margin-bottom:10px}.releasecard img{width:75px;height:110px;object-fit:cover;border-radius:9px;background:var(--surface2)}.releaseinfo{flex:1;min-width:0;display:flex;flex-direction:column}.releaseinfo h3{font-size:13px;margin:2px 0 5px}.release-date{font-size:11px;color:var(--muted)}.countdown{font-size:16px;font-weight:850;color:var(--accent);margin-top:7px}.status{font-size:10px;color:var(--muted);margin-top:2px}.release-actions{display:flex;justify-content:flex-end;align-items:end;flex:1}.bottom{position:fixed;z-index:20;bottom:0;left:0;right:0;background:var(--nav);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom))}.navbtn{background:none;color:var(--muted);font-size:10px;display:grid;gap:3px;justify-items:center;padding:3px}.navbtn span:first-child{font-size:19px}.navbtn.active{color:var(--accent);font-weight:800}.panel{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:14px;margin:12px 0}.panel h3{font-size:13px;margin:0 0 9px}.field{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--text);padding:11px;outline:0}.fieldrow{display:flex;gap:8px}.fieldrow .field{flex:1;min-width:0}.settingrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.settingrow:last-child{border:0}.settingrow select{max-width:155px}.modal{position:fixed;inset:0;z-index:40;background:#080b12b8;display:none;align-items:flex-end;justify-content:center;padding:12px}.modal.open{display:flex}.sheet{background:var(--surface);border-radius:20px 20px 14px 14px;width:min(100%,620px);max-height:92dvh;overflow:auto;padding:14px}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.detailhero{display:flex;gap:13px}.detailhero img{width:112px;max-height:168px;object-fit:cover;border-radius:10px}.detailhero h2{font-size:18px;line-height:1.2;margin:3px 0 7px}.overview{font-size:12px;line-height:1.6;color:var(--muted);margin:14px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.viewer{position:fixed;inset:0;background:#05070bf2;z-index:60;display:none;align-items:center;justify-content:center;padding:20px}.viewer.open{display:flex}.viewer img{max-width:100%;max-height:82vh;object-fit:contain}.viewer .close{position:absolute;top:calc(18px + env(safe-area-inset-top));right:18px;background:#ffffff22;color:#fff}.toast{position:fixed;z-index:80;bottom:90px;left:50%;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:var(--text);color:var(--surface);padding:10px 15px;border-radius:20px;font-size:11px;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.skeleton{height:280px;border-radius:15px;background:linear-gradient(90deg,var(--surface2),var(--surface),var(--surface2));background-size:200% 100%;animation:shimmer 1.4s infinite}@keyframes shimmer{to{background-position:-200% 0}}@media(min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<header class="top"><div class="toprow"><div class="brand"><div class="brandmark">▣</div><div>Cinema Tracker<div class="subbrand">XXI · CGV · CINÉPOLIS · IMAX</div></div></div><button class="iconbtn" id="quickCalendar" aria-label="Watchlist">▦</button><button class="iconbtn" id="quickAlerts" aria-label="Notifications">♧<i class="count" id="watchCount">0</i></button><button class="iconbtn" id="refreshBtn" aria-label="Refresh">↻</button></div><div class="tabs" id="homeTabs"><button class="active" data-filter="now">SEDANG TAYANG</button><button data-filter="upcoming">AKAN DATANG</button><button data-filter="popular">POPULER</button></div></header>
<main id="app"><div class="sectionhead"><h2>Film pilihan</h2><span class="tiny muted" id="lastUpdated"></span></div><div class="grid"><div class="skeleton"></div><div class="skeleton"></div></div></main>
<nav class="bottom"><button class="navbtn active" data-page="home"><span>▦</span>Bioskop</button><button class="navbtn" data-page="search"><span>⌕</span>Cari</button><button class="navbtn" data-page="watchlist"><span>⚑</span>Watchlist <i id="navCount"></i></button><button class="navbtn" data-page="settings"><span>⚙</span>Settings</button></nav>
<div class="modal" id="detailModal"><div class="sheet"><div class="sheethead"><span class="muted tiny">DETAIL FILM</span><button class="iconbtn" data-close="detailModal">✕</button></div><div id="detailContent"></div></div></div><div class="viewer" id="posterViewer"><button class="iconbtn close" data-close="posterViewer">✕</button><img id="viewerImage" alt="Poster film"></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const STORE='ct_v50_state',OLD_KEYS=['cinema_tracker_state','ct_state','watchlist','cinemaWatchlist'];
const defaults={watchlist:[],tba:[],apiKey:'',theme:'system',homeFilter:'now',sort:'date',minHype:85,interval:'6',posterOverrides:{},alerts:true};
let state={...defaults},page='home',searchTimer=null,searchToken=0,homeCache={},detailCache={},searchCache={},toastTimer=null;
const bridge=window.AndroidBridge;
function safeParse(v,f){try{return JSON.parse(v)||f}catch(_){return f}}
function load(){let native='';try{native=bridge?.getPersistedState?.()||''}catch(_){}let local=safeParse(localStorage.getItem(STORE),null);if(!local){for(const k of OLD_KEYS){const v=safeParse(localStorage.getItem(k),null);if(v){local=v;break}}}const n=safeParse(native,null);state={...defaults,...(n||{}),...(local||{})};if(!Array.isArray(state.watchlist))state.watchlist=[];if(!Array.isArray(state.tba))state.tba=[];state.watchlist=state.watchlist.filter(x=>x&&x.id).map(x=>({...x,id:Number(x.id),title:x.title||x.name||'Film',release_date:x.release_date||'',poster_path:x.poster_path||null}));}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch(_){}try{bridge?.savePersistedState?.(JSON.stringify(state));bridge?.syncRadarState?.(JSON.stringify(state.watchlist.map(x=>({...x,notify_presale:true,notify_h1:true,notify_h0:true}))),JSON.stringify(state.tba),state.apiKey)}catch(_){}updateCounts()}
const apiBase='https://api.themoviedb.org/3',imgBase='https://image.tmdb.org/t/p/';
function apiUrl(path,params={}){const u=new URL(apiBase+path);u.searchParams.set('api_key',state.apiKey.trim());u.searchParams.set('language','id-ID');Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));return u}
async function api(path,params={}){if(!state.apiKey.trim())throw Error('Masukkan API Key TMDB di Settings terlebih dahulu.');const r=await fetch(apiUrl(path,params),{headers:{Accept:'application/json'},cache:'default'});if(!r.ok)throw Error(r.status===401?'API Key TMDB tidak valid.':`TMDB error ${r.status}`);return r.json()}
function poster(path,size='w342'){return path?imgBase+size+path:''}
function escapeHtml(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(s){if(!s||s.length<10)return 'Tanggal belum diumumkan';const d=new Date(s.slice(0,10)+'T00:00:00');return new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'long',year:'numeric'}).format(d)}
function daysUntil(s){if(!s||s.length<10)return null;const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),d=new Date(s.slice(0,10)+'T00:00:00');return Math.round((d-today)/86400000)}
function releaseStatus(m){const d=daysUntil(m.release_date);if(d===null)return 'Tanggal belum tersedia';if(d<0)return 'Sudah tayang';if(d===0)return 'Tayang hari ini';return `Dalam ${d} hari`}
function isSaved(id){return state.watchlist.some(x=>Number(x.id)===Number(id))}
function updateCounts(){const n=state.watchlist.length;$('#watchCount').textContent=n;$('#navCount').textContent=n?`(${n})`:''}
function notify(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1900)}
function setTheme(){const dark=state.theme==='dark'||(state.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.body.classList.toggle('dark',dark);const color=dark?'#0e1118':'#f5f6fa';document.querySelector('meta[name="theme-color"]').content=color;try{bridge?.updateSystemBars?.(color,dark)}catch(_){}}
function syncSaveIndicators(){document.querySelectorAll('[data-save]').forEach(b=>{const yes=isSaved(Number(b.dataset.save));b.classList.toggle('saved',yes);if(b.classList.contains('save'))b.textContent=yes?'♥':'♧';else b.textContent=yes?'♥ Tersimpan':'＋ Watchlist'});if($('#detailContent [data-save]'))$('#detailContent [data-save]').textContent=isSaved(Number($('#detailContent [data-save]').dataset.save))?'♥ Tersimpan di Watchlist':'＋ Simpan ke Watchlist';updateCounts()}
function addWatch(m){if(isSaved(m.id))return removeWatch(m.id);state.watchlist.unshift({id:Number(m.id),title:m.title||m.name,original_title:m.original_title||m.original_name||'',release_date:m.release_date||'',poster_path:m.poster_path||null,backdrop_path:m.backdrop_path||null,vote_average:m.vote_average||0,overview:m.overview||'',added_at:Date.now()});save();syncSaveIndicators();if(page==='watchlist')renderWatchlist();notify('Ditambahkan ke Watchlist')}
function removeWatch(id){state.watchlist=state.watchlist.filter(x=>Number(x.id)!==Number(id));save();syncSaveIndicators();if(page==='watchlist')renderWatchlist();notify('Dihapus dari Watchlist')}
function card(m){const saved=isSaved(m.id),p=state.posterOverrides[m.id]||m.poster_path;return `<article class="movie"><div class="posterwrap" data-detail="${m.id}">${p?`<img class="poster" loading="lazy" decoding="async" src="${poster(p)}" alt="Poster ${escapeHtml(m.title||m.name)}">`:`<div class="posterplaceholder">▣</div>`}<button class="save ${saved?'saved':''}" data-save="${m.id}" aria-label="${saved?'Hapus dari':'Tambah ke'} Watchlist">${saved?'♥':'♧'}</button></div><div class="movieinfo" data-detail="${m.id}"><div class="movietitle">${escapeHtml(m.title||m.name)}</div><div class="meta">${(m.release_date||'').slice(0,4)||'TBA'} · <span class="rating">★ ${Number(m.vote_average||0).toFixed(1)}</span></div></div></article>`}
function setMain(html){$('#app').innerHTML=html}
function setPage(p){page=p;$$('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#homeTabs').style.display=p==='home'?'flex':'none';renderCurrent()}
function renderCurrent(){updateCounts();if(page==='home')renderHome();else if(page==='search')renderSearchShell();else if(page==='watchlist')renderWatchlist();else renderSettings()}
async function renderHome(){const f=state.homeFilter;const title=f==='now'?'Sedang Tayang':f==='upcoming'?'Akan Datang':'Populer';setMain(`<div class="sectionhead"><h2>${title}</h2><span class="tiny muted" id="lastUpdated"></span></div><div class="grid"><div class="skeleton"></div><div class="skeleton"></div></div>`);$$('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===f));if(!state.apiKey){setMain(`<div class="empty"><b>Mulai jelajahi film</b>Tambahkan TMDB API Key di Settings untuk memuat katalog film.</div>`);return}try{const key=f;let data=homeCache[key];if(!data||Date.now()-data.time>300000){const path=f==='now'?'/movie/now_playing':f==='upcoming'?'/movie/upcoming':'/movie/popular';data={items:(await api(path,{region:'ID',page:1})).results||[],time:Date.now()};homeCache[key]=data}const items=data.items;setMain(`<div class="sectionhead"><h2>${title}</h2><span class="tiny muted">${items.length} film</span></div>${items.length?`<div class="grid">${items.map(card).join('')}</div>`:`<div class="empty">Belum ada film.</div>`}`)}catch(e){setMain(`<div class="empty"><b>Belum bisa memuat katalog</b>${escapeHtml(e.message)}<p><button class="secondary" id="goSettings">Buka Settings</button></p></div>`)} }
function renderSearchShell(){setMain(`<div class="sectionhead"><h2>Cari Film</h2><span class="tiny muted">TMDB</span></div><div class="muted tiny">Cari judul film dari katalog global maupun film yang akan tayang.</div><div class="searchbox"><span>⌕</span><input id="searchInput" placeholder="Cari judul film..." autocomplete="off"><button id="clearSearch" class="muted">×</button></div><div id="searchResults"><div class="empty"><b>Film apa yang lagi lo incar?</b>Ketik judul untuk mulai mencari.</div></div>`);$('#searchInput').addEventListener('input',e=>{clearTimeout(searchTimer);const q=e.target.value.trim();searchTimer=setTimeout(()=>doSearch(q),420)});$('#clearSearch').onclick=()=>{$('#searchInput').value='';$('#searchResults').innerHTML='<div class="empty"><b>Film apa yang lagi lo incar?</b>Ketik judul untuk mulai mencari.</div>'}}
async function doSearch(q){const target=$('#searchResults');if(!target)return;if(q.length<2){target.innerHTML='<div class="empty">Ketik minimal 2 karakter.</div>';return}if(!state.apiKey){target.innerHTML='<div class="empty">Atur API Key TMDB di Settings terlebih dahulu.</div>';return}const token=++searchToken;target.innerHTML='<div class="empty">Mencari di TMDB…</div>';try{const data=await api('/search/movie',{query:q,include_adult:false,page:1,region:'ID'});(data.results||[]).forEach(m=>searchCache[m.id]=m);if(token!==searchToken||!$('#searchResults'))return;const items=data.results||[];target.innerHTML=items.length?items.map(m=>`<div class="searchresult"><img loading="lazy" src="${poster(m.poster_path,'w185')}" alt=""><div class="details"><h3>${escapeHtml(m.title)}</h3><div class="tiny muted">${(m.release_date||'').slice(0,4)||'TBA'} · ★ ${Number(m.vote_average||0).toFixed(1)}</div><div class="tiny muted" style="margin:5px 0">${escapeHtml((m.overview||'Sinopsis belum tersedia').slice(0,105))}${(m.overview||'').length>105?'…':''}</div><button class="primary" data-save="${m.id}">${isSaved(m.id)?'♥ Tersimpan':'＋ Watchlist'}</button> <button class="secondary" data-detail="${m.id}">Detail</button></div></div>`).join(''):'<div class="empty">Film tidak ditemukan.</div>'}catch(e){target.innerHTML=`<div class="empty">${escapeHtml(e.message)}</div>`}}
function renderWatchlist(){const list=[...state.watchlist].sort((a,b)=>{const da=daysUntil(a.release_date),db=daysUntil(b.release_date);return (da===null?99999:da)-(db===null?99999:db)});setMain(`<div class="sectionhead"><h2>Watchlist</h2><span class="tiny muted">${list.length} film incaran</span></div><div class="muted tiny" style="margin-bottom:13px">Pantau kapan film incaran lo tayang di bioskop Indonesia.</div>${list.length?list.map(m=>{const d=daysUntil(m.release_date),date=m.release_date?fmtDate(m.release_date):'Jadwal Indonesia belum tersedia';const countdown=d===null?'Menunggu jadwal':d<0?'Sudah tayang':d===0?'Tayang hari ini':`${d} hari lagi`;return `<article class="releasecard"><img loading="lazy" src="${poster(state.posterOverrides[m.id]||m.poster_path,'w185')}" data-view-poster="${m.id}" alt=""><div class="releaseinfo"><h3>${escapeHtml(m.title)}</h3><div class="release-date">${date}</div><div class="countdown">${countdown}</div><div class="status">${d!==null&&d<0?'Sudah masuk periode tayang':d===0?'Saatnya ke bioskop':'Countdown rilis Indonesia'}</div><div class="release-actions"><button class="secondary" data-detail="${m.id}">Detail</button> <button class="danger" data-save="${m.id}">Hapus</button></div></div></article>`}).join(''):`<div class="empty"><b>Watchlist masih kosong</b>Simpan film incaran dari halaman Bioskop atau Cari. Nanti tanggal rilis dan countdown-nya muncul di sini.</div>`}`)}
function renderSettings(){setMain(`<div class="sectionhead"><h2>Settings</h2></div><section class="panel"><h3>Tampilan</h3><div class="settingrow"><div><b>Tema aplikasi</b><div class="tiny muted">Sinkron dengan status bar Android</div></div><select class="field" id="themeSelect"><option value="system">System</option><option value="light">Light Mode</option><option value="dark">Dark Mode</option></select></div></section><section class="panel"><h3>TMDB API Key</h3><div class="tiny muted" style="margin-bottom:9px">Diperlukan untuk katalog, pencarian, detail, tanggal rilis Indonesia, dan poster alternatif. API key disimpan lokal di perangkat.</div><div class="fieldrow"><input class="field" id="apiKeyInput" type="password" placeholder="Masukkan TMDB API Key" value="${escapeHtml(state.apiKey)}"><button class="secondary" id="toggleKey">Tampil</button></div><button class="primary" id="saveKey" style="width:100%;margin-top:9px">Simpan & Perbarui Katalog</button><div class="tiny muted" style="margin-top:8px">${state.apiKey?'API Key tersimpan di perangkat ini.':'Belum ada API Key.'}</div></section><section class="panel"><h3>Pengingat</h3><div class="settingrow"><div><b>Notifikasi rilis</b><div class="tiny muted">Pemeriksaan latar belakang setiap 6 jam saat online</div></div><span class="tiny">WorkManager</span></div><div class="settingrow"><div><b>Minimal hype</b><div class="tiny muted">Filter radar film populer</div></div><select class="field" id="hypeSelect"><option value="75">75% (Lebih banyak)</option><option value="85">85% (Populer)</option><option value="90">90% (Selektif)</option></select></div></section><section class="panel"><h3>Data & Privasi</h3><div class="tiny muted">Watchlist dan preferensi disimpan di perangkat (localStorage + SharedPreferences). Tidak ada akun Cinema Tracker atau analytics pihak ketiga.</div><button class="secondary" id="exportData" style="width:100%;margin-top:10px">Ekspor Watchlist (JSON)</button></section><section class="panel"><h3>Tentang</h3><div class="tiny muted">Cinema Tracker v5.0.0 · Release-first edition</div><div class="tiny muted" style="margin-top:5px">Data film disediakan oleh TMDB. Cinema Tracker tidak berafiliasi dengan TMDB.</div></section>`);$('#themeSelect').value=state.theme;$('#hypeSelect').value=String(state.minHype);$('#themeSelect').onchange=e=>{state.theme=e.target.value;save();setTheme()};$('#hypeSelect').onchange=e=>{state.minHype=Number(e.target.value);save()};$('#toggleKey').onclick=()=>{const i=$('#apiKeyInput');i.type=i.type==='password'?'text':'password';$('#toggleKey').textContent=i.type==='password'?'Tampil':'Sembunyi'};$('#saveKey').onclick=()=>{state.apiKey=$('#apiKeyInput').value.trim();save();homeCache={};notify('API Key tersimpan');setPage('home')};$('#exportData').onclick=()=>{const blob=new Blob([JSON.stringify({watchlist:state.watchlist,exported_at:new Date().toISOString()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cinema-tracker-watchlist.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}
async function openDetail(id){let m=detailCache[id]||searchCache[id]||homeCache[state.homeFilter]?.items?.find(x=>Number(x.id)===Number(id))||state.watchlist.find(x=>Number(x.id)===Number(id));if(!m){notify('Detail film tidak tersedia');return}$('#detailModal').classList.add('open');$('#detailContent').innerHTML='<div class="empty">Memuat detail film…</div>';try{if(state.apiKey){m=await api('/movie/'+id,{append_to_response:'release_dates,videos,images'});detailCache[id]=m;const rel=m.release_dates?.results?.find(x=>x.iso_3166_1==='ID');let idDate='';if(rel?.release_dates?.length){const dates=rel.release_dates.filter(x=>x.release_date).sort((a,b)=>a.release_date.localeCompare(b.release_date));const preferred=dates.find(x=>[2,3].includes(x.type))||dates[0];idDate=preferred?.release_date?.slice(0,10)||''}if(idDate){m.release_date=idDate;const w=state.watchlist.find(x=>Number(x.id)===Number(id));if(w){w.release_date=idDate;save()}}}const saved=isSaved(id),p=state.posterOverrides[id]||m.poster_path,yt=m.videos?.results?.find(v=>v.site==='YouTube'&&v.type==='Trailer')?.key||'';$('#detailContent').innerHTML=`<div class="detailhero"><img src="${poster(p,'w342')}" id="detailPoster" alt="Poster"><div><h2>${escapeHtml(m.title||m.name)}</h2><div class="tiny muted">${(m.release_date||'').slice(0,4)||'TBA'} · ${m.runtime?m.runtime+' menit · ':''}★ ${Number(m.vote_average||0).toFixed(1)}</div><div class="tiny" style="margin-top:9px;color:var(--accent);font-weight:800">${fmtDate(m.release_date)} · ${releaseStatus(m)}</div><div class="tiny muted" style="margin-top:6px">${(m.genres||[]).slice(0,3).map(g=>escapeHtml(g.name)).join(' · ')}</div></div></div><p class="overview">${escapeHtml(m.overview||'Sinopsis belum tersedia dalam bahasa Indonesia.')}</p><div class="actions"><button class="primary" data-save="${m.id}">${saved?'♥ Tersimpan di Watchlist':'＋ Simpan ke Watchlist'}</button><button class="secondary" id="viewPoster">Lihat Poster</button><button class="secondary" id="downloadPoster">Simpan Poster HD</button>${yt?'<button class="secondary" id="trailerBtn">▶ Trailer</button>':''}<button class="secondary" id="letterboxdBtn">Letterboxd</button></div><section class="panel"><h3>Poster alternatif</h3><div class="tiny muted">Pilih artwork lain dari TMDB bila tersedia.</div><div class="chips" id="altPosters" style="margin-top:9px"></div></section>`;$('#viewPoster').onclick=()=>showViewer(p);$('#downloadPoster').onclick=()=>downloadPoster(p,m.title);$('#trailerBtn')?.addEventListener('click',()=>{try{bridge?.openTrailerDirect?.(yt,m.title)}catch(_){window.open('https://www.youtube.com/watch?v='+yt,'_blank')}});$('#letterboxdBtn').onclick=()=>{try{bridge?.openLetterboxdDirect?.(Number(m.id),slug(m.title))}catch(_){window.open('https://letterboxd.com/tmdb/'+m.id+'/','_blank')}};const posters=m.images?.posters||[];$('#altPosters').innerHTML=posters.slice(0,10).map(x=>`<img data-alt-poster="${escapeHtml(x.file_path)}" src="${poster(x.file_path,'w185')}" style="width:62px;height:92px;object-fit:cover;border-radius:7px" loading="lazy">`).join('')||'<span class="tiny muted">Tidak ada poster alternatif.</span>'}catch(e){$('#detailContent').innerHTML=`<div class="empty"><b>Detail belum bisa dimuat</b>${escapeHtml(e.message)}<p><button class="secondary" data-close="detailModal">Tutup</button></p></div>`}}
function slug(s=''){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function showViewer(path){if(!path)return;$('#viewerImage').src=poster(path,'original');$('#posterViewer').classList.add('open')}
async function downloadPoster(path,title){if(!path)return notify('Poster tidak tersedia');notify('Menyiapkan poster HD…');try{const r=await fetch(poster(path,'original'));if(!r.ok)throw Error('download');const blob=await r.blob();const reader=new FileReader();reader.onload=()=>{try{bridge?.savePosterBase64?.(reader.result,slug(title||'poster')+'.jpg');if(!bridge)notify('Penyimpanan galeri hanya tersedia di aplikasi Android')}catch(_){notify('Gagal menyimpan poster')}};reader.readAsDataURL(blob)}catch(_){notify('Gagal mengambil poster HD. Coba lagi saat online.')}}
function renderTba(){/* TBA radar is intentionally lightweight and only synced when configured. */}
function closeModal(id){$('#'+id)?.classList.remove('open')}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){setPage(nav.dataset.page);return}const filter=e.target.closest('[data-filter]');if(filter){state.homeFilter=filter.dataset.filter;save();renderHome();return}const saveBtn=e.target.closest('[data-save]');if(saveBtn){e.stopPropagation();const id=Number(saveBtn.dataset.save);let m=detailCache[id]||searchCache[id]||state.watchlist.find(x=>Number(x.id)===id)||homeCache[state.homeFilter]?.items?.find(x=>Number(x.id)===id);if(m)addWatch(m);else notify('Data film tidak ditemukan');return}const det=e.target.closest('[data-detail]');if(det){openDetail(Number(det.dataset.detail));return}const view=e.target.closest('[data-view-poster]');if(view){const m=state.watchlist.find(x=>Number(x.id)===Number(view.dataset.viewPoster));if(m)showViewer(state.posterOverrides[m.id]||m.poster_path);return}const alt=e.target.closest('[data-alt-poster]');if(alt){const path=alt.dataset.altPoster;const id=Number($('#detailContent [data-save]')?.dataset.save);if(id){state.posterOverrides[id]=path;save();const img=$('#detailPoster');if(img)img.src=poster(path,'w342');notify('Poster alternatif diterapkan')}return}const close=e.target.closest('[data-close]');if(close){closeModal(close.dataset.close);return}});
$('#quickCalendar').onclick=()=>setPage('watchlist');$('#quickAlerts').onclick=()=>notify('Pengingat rilis dikelola otomatis oleh Android');$('#refreshBtn').onclick=()=>{homeCache={};renderHome();notify('Memperbarui katalog…')};$('#goSettings')?.addEventListener('click',()=>setPage('settings'));document.addEventListener('click',e=>{if(e.target.id==='goSettings')setPage('settings')});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal('detailModal');closeModal('posterViewer')}});matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(state.theme==='system')setTheme()});
load();setTheme();updateCounts();setPage('home');
})();
</script></body></html>
